      - Reliable inquiry delivery, deduplication, recovery, and measurement
  implementation: {status: implemented_and_deployed, manifest: mps/implementation/PRODUCT-IMPLEMENTATION.md, merged: fcb30f5, merged_at: "2026-09-14", production_url: "https://supabase-saas-launch-readiness-lab.vercel.app/", note: "All six product slices are implemented, merged to main, and served by the production deployment. Formal S6 release approval is an owner checkpoint and has not been recorded."}

governance:
  decisions:
    - {id: MPS-DEC-001, statement: "Move POB-2026-36-02 into production.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-002, statement: "Use a narrowly scoped Upwork launch-readiness proof product.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-003, statement: "R1 combines an interactive synthetic lab with an audit report and case study.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-004, statement: "The buyer journey ends in an authorized review or remediation inquiry.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-005, statement: "Position as launch-readiness review and remediation, not certification or formal penetration testing.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-006, statement: "Approve the proposed buyer workflow, R1 boundary, requirements, rules, and acceptance criteria and proceed to MDS.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-007, statement: "Retain inquiry records for no more than 12 months after latest activity, allow earlier manual deletion, and retain only minimal operational deduplication metadata afterward when necessary.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-008, statement: "The production site is intended to be publicly indexable. Preview deployments must not be treated as canonical or intentionally indexed.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-14", applies_in: "portfolio-polish slice (robots and sitemap behaviour are not added in the R1 closeout)"}
    - {id: MPS-DEC-009, statement: "Simplify the first-contact explanation while preserving every synthetic-data, authorization, evidence, and non-certification guardrail, and explain relevance to founders, agencies, and development teams preparing to launch, accept payments, onboard customers, or expose real data.", status: approved_in_principle, approved_by: Josh Coley, approved_at: "2026-09-14", applies_in: "portfolio-polish slice"}
    - {id: MPS-DEC-010, statement: "Positioning clarification and guardrail: the lab is relevant to AI-assisted, rapidly assembled, agency-delivered, or inherited Supabase applications. Named tools such as Lovable, Bolt, v0, and Cursor may appear as contextual examples only. Do not claim or imply that those tools inherently produce insecure applications; do not make those brands part of the permanent product identity; do not narrow the audience to users of those tools. The underlying risk statement stays focused on launch speed, unclear ownership, missing verification, and application-to-Supabase integration boundaries.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-14", classification: "Positioning clarification and guardrail, not a claim about third-party products. It adds no requirement, rule, or acceptance criterion and does not change the approved actors.", version_intent: "Approved as the MPS v1.2 positioning clarification. mps_version stays v1.1 until the clarification is written into PRODUCT-BLUEPRINT.md and the downstream MDS and MTS consumers are synchronized, which belongs to the portfolio-polish slice."}
    - {id: MPS-DEC-011, statement: "Beginner and technical-reviewer paths are optional variants of MPS-WFL-001. They converge on the existing scenario, report, and authorized-review workflow and create no account, personalized scan, or separate product workflow.", status: approved_in_principle, approved_by: Josh Coley, approved_at: "2026-09-14", applies_in: "portfolio-polish slice; the composition must be proposed under the approved MDS before implementation"}
    - {id: MPS-DEC-012, statement: "The public application may link to the public GitHub repository through a restrained technical-implementation path. The link must not be presented as authorization to run the synthetic fixture against another system, and the distinction between published fixture code and a reusable public exploit endpoint is preserved.", status: approved_in_principle, approved_by: Josh Coley, approved_at: "2026-09-14", applies_in: "portfolio-polish slice; exact placement is an MDS composition decision"}
    - {id: MPS-DEC-013, statement: "Social-preview image direction: reuse existing MDS tokens, typography, product identity, product mark, and ink-surface treatment; prefer the product name plus a neutral launch-readiness descriptor; avoid findings, scores, certification-style badges, guarantees, or claims that would need extensive qualification. The image is presented for owner approval before it becomes canonical.", status: approved_direction, approved_by: Josh Coley, approved_at: "2026-09-14", applies_in: "portfolio-polish slice"}
  assumptions:
    - {id: MPS-ASM-001, statement: "Synthetic proof can attract authorized work.", status: open, blocking: false}
    - {id: MPS-ASM-002, statement: "Buyers value reproducible remediation proof over a checklist alone.", status: open, blocking: false}
  gaps: []
  risks:
    - {id: MPS-RISK-001, area: credibility, statement: "A toy-like demo could reduce buyer confidence.", severity: high, status: open}
    - {id: MPS-RISK-002, area: safety, statement: "Poorly bounded exploit language could imply unauthorized testing.", severity: high, status: controlled_by_rules}
    - {id: MPS-RISK-003, area: scope, statement: "Trying to prove every concern could delay R1.", severity: high, status: controlled_by_release_boundary}
  exceptions: []
  deviations: []
  changes: []
  versions:
