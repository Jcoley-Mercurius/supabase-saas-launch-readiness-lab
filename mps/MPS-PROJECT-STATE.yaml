downstream:
  mds: {project_id: POB-2026-36-02-MDS, version: v1.0, status: implementation_ready, compatible_mps_version: v1.1, last_synchronized: "2026-09-05", open_product_gaps: []}
  mts:
    status: implementation_readiness_in_progress
    project_id: supabase-saas-launch-readiness-lab
    version: v0.6-draft
    last_synchronized: "2026-09-06"
    engineering_capability_signals:
      - Safe synthetic multi-tenant fixtures and negative-authorization execution
      - Deterministic webhook replay and idempotency evidence
      - Secret-safe evidence and redacted telemetry
      - Reliable inquiry delivery, deduplication, recovery, and measurement
  implementation: {status: not_started, manifest: mps/implementation/PRODUCT-IMPLEMENTATION.md}

governance:
  decisions:
    - {id: MPS-DEC-001, statement: "Move POB-2026-36-02 into production.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-002, statement: "Use a narrowly scoped Upwork launch-readiness proof product.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-003, statement: "R1 combines an interactive synthetic lab with an audit report and case study.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-004, statement: "The buyer journey ends in an authorized review or remediation inquiry.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-005, statement: "Position as launch-readiness review and remediation, not certification or formal penetration testing.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-006, statement: "Approve the proposed buyer workflow, R1 boundary, requirements, rules, and acceptance criteria and proceed to MDS.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
    - {id: MPS-DEC-007, statement: "Retain inquiry records for no more than 12 months after latest activity, allow earlier manual deletion, and retain only minimal operational deduplication metadata afterward when necessary.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-05"}
  assumptions:
    - {id: MPS-ASM-001, statement: "Synthetic proof can attract authorized work.", status: open, blocking: false}
    - {id: MPS-ASM-002, statement: "Buyers value reproducible remediation proof over a checklist alone.", status: open, blocking: false}
  gaps: []
  risks:
    - {id: MPS-RISK-001, area: credibility, statement: "A toy-like demo could reduce buyer confidence.", severity: high, status: open}
    - {id: MPS-RISK-002, area: safety, statement: "Poorly bounded exploit language could imply unauthorized testing.", severity: high, status: controlled_by_rules}
    - {id: MPS-RISK-003, area: scope, statement: "Trying to prove every concern could delay R1.", severity: high, status: controlled_by_release_boundary}
  exceptions: []
  deviations: []
  changes: []
