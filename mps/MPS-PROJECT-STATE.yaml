mps:
  system: Mercurius Product System
  schema_version: "1.1"
  project_id: POB-2026-36-02
  project_name: Supabase SaaS Launch-Readiness Lab
  lifecycle: approved
  mps_version: v1.1
  current_gate: approval_handoff
  created_at: "2026-09-05"
  updated_at: "2026-09-14"

project:
  product_type: service-proof portfolio product and synthetic audit lab
  business_stage: production design
  platforms: [web, Upwork portfolio]
  decision_owners: [Josh Coley]
  purpose: Help SaaS founders and agencies identify launch-blocking Supabase, payment-integrity, data-isolation, and reliability failures before real users are affected.
  value_proposition: Reproducible negative tests, before/after remediation proof, severity-ranked findings, and implementation-aware guidance in a buyer-readable experience.
  constraints:
    - Synthetic data and authorized testing only.
    - No formal penetration testing, certification, compliance attestation, legal opinion, or guaranteed launch-readiness claim.
    - No production credentials, buyer application uploads, or real customer records in R1.
    - Vulnerable, remediated, untested, and unavailable evidence states remain distinct.

outcomes:
  - {id: MPS-OUT-001, type: user, statement: "A founder or agency can understand whether representative authorization, tenant-isolation, payment-state, and reliability controls are launch-ready.", status: approved}
  - {id: MPS-OUT-002, type: user, statement: "A buyer can reproduce representative failures and verify the documented remediation.", status: approved}
  - {id: MPS-OUT-003, type: business, statement: "Josh gains differentiated proof for winning Supabase launch-readiness and remediation work on Upwork.", status: approved}
  - {id: MPS-OUT-004, type: business, statement: "The lab reveals which proof formats and risk concerns generate qualified freelance interest.", status: approved}

actors:
  - {id: MPS-ACT-001, name: "SaaS founder or product owner", type: primary_user, status: approved}
  - {id: MPS-ACT-002, name: "Agency or development team", type: primary_user, status: approved}
  - {id: MPS-ACT-003, name: "Josh / auditor-developer", type: operator, status: approved}
  - {id: MPS-ACT-004, name: "Upwork prospect or portfolio reviewer", type: affected_non_user, status: approved}

scope:
  release: MPS-REL-001
  capabilities:
    - {id: MPS-CAP-001, name: "Synthetic SaaS launch-risk demonstration", status: approved}
    - {id: MPS-CAP-002, name: "Authorization and tenant-isolation verification", status: approved}
    - {id: MPS-CAP-003, name: "Payment and webhook-integrity verification", status: approved}
    - {id: MPS-CAP-004, name: "Reliability and recovery verification", status: approved}
    - {id: MPS-CAP-005, name: "Buyer-readable audit evidence and remediation reporting", status: approved}
    - {id: MPS-CAP-006, name: "Portfolio conversion and authorized-engagement path", status: approved}
  r1_includes:
    - One coherent synthetic multi-tenant SaaS
    - RLS, cross-tenant, storage, and configuration-boundary proof
    - Webhook replay and idempotency proof
    - One representative reliability and recovery scenario
    - Severity-ranked sample report and case study
    - Inquiry CTA for an authorized review or remediation engagement
  r1_excludes:
    - Live-system testing or buyer uploads
    - Production credentials and customer data
    - Certification, compliance attestation, and formal penetration testing
    - Client portal, billing, scheduling, contracts, and automated buyer risk scoring

workflows:
  - {id: MPS-WFL-001, name: "Discover proof and request an authorized engagement", status: approved, artifact: mps/WORKFLOW-CATALOG.md}

business_rules:
  - {id: MPS-RULE-001, statement: "Synthetic or explicitly authorized data only.", status: approved}
  - {id: MPS-RULE-002, statement: "Vulnerable, remediated, untested, and unavailable states remain distinct.", status: approved}
  - {id: MPS-RULE-003, statement: "A demonstration does not authorize third-party testing.", status: approved}
  - {id: MPS-RULE-004, statement: "R1 has no buyer upload or production-credential path.", status: approved}
  - {id: MPS-RULE-005, statement: "Inquiry acknowledgement is not engagement acceptance or a guarantee.", status: approved}
  - {id: MPS-RULE-006, statement: "Duplicate inquiries must not create duplicate engagements.", status: approved}
  - {id: MPS-RULE-007, statement: "Fixed, passed, and launch-ready claims apply only to documented or authorized scope.", status: approved}
  - {id: MPS-RULE-008, statement: "Inquiry records are retained for no more than 12 months after latest activity, may be manually deleted earlier, and may leave only minimal operational deduplication metadata afterward.", status: approved}

