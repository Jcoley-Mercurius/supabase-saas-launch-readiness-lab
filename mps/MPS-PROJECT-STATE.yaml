    - {version: v1.0, date: "2026-09-05", reason: "Owner-approved R1 and MDS handoff."}
    - {version: v1.1, date: "2026-09-05", reason: "Added the owner-approved R1 inquiry retention and deletion policy discovered during MTS Gate 1."}

