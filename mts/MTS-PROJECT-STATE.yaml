  previous_slice: {id: S3, status: approved, approved_by: Josh Coley, approved_at: "2026-09-07", checkpoint: S3_approved_S4_may_begin, approval_note: "Owner approved S3 and its eight checkpoint observations (MTS-OBS-020 through 027) on 2026-09-07, after directing the two decisions taken at the checkpoint: MTS-DEC-010 (HMAC-SHA256 signatures via pgcrypto) and MTS-DEC-011 (the browser suite builds and serves production everywhere). Committed as b42554c and opened as PR #5; the merge to main is not yet made.", branch: slice/s3-replay-recovery, verified_at: "2026-09-07", verification: "pnpm check green from a deleted .next (format, lint, typecheck, 9 evidence freshness checks, 79 unit tests, production build); pnpm evidence:verify green against a live local database, all 8 steps - the freshness gate, 12 SQL fixture-safety checks, and two clean-database re-recordings that reproduced BOTH committed transcripts byte for byte; 405 Playwright checks across the same five projects; WebKit remains CI-only per MTS-EXC-002. CORRECTED 2026-09-07: the original entry described these as running against a from-clean production build. They did not - playwright.config.ts serves `next dev` unless CI is set, so every workstation browser run in this project has exercised a development build. See MTS-OBS-027. The re-run after the MTS-DEC-010 signature change was executed at 1 worker on a settled machine: 405 checks, 400 passed and 5 failed, the five being one deterministic assertion in all five projects caused by the dev-only overlay described in MTS-OBS-027. FINAL: after MTS-DEC-011 made the suite build and serve production everywhere, the full suite ran green - 405 passed, 0 failed, 0 flaky, at 1 worker, in 10.4 minutes against a production build this run created and served itself. The same suite took 24.8 minutes against the development build, which is a second reason the previous configuration was the wrong one. At 8 workers this workstation cannot run the suite at all - load average above 30, tests taking 20-60s that take 1-3s at 1 worker, and dozens of page.goto timeouts, which is MTS-OBS-014 and MTS-OBS-018 recurring. The authoritative browser evidence is the CI run in MTS-OBS-019, which does build and serve production", verification_note: "Firefox reproduced MTS-OBS-014 exactly: at the local default of 8 workers it failed 64 of 81 checks, dominated by page.goto and locator.click timeouts - the browser could not load pages at all, which is starvation rather than product behaviour. Re-run at 1 worker, matching the CI configuration, the same 81 checks passed in 2.8 minutes with no code change. The workstation is the constraint, not the product."}
