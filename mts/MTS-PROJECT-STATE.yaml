    - {id: MTS-DEC-002, area: design_contract, key: consumed_mds, value: "MDS v1.0", status: observed, source: mds/MDS-PROJECT-STATE.yaml, rationale: "MDS is approved and implementation-ready."}
    - {id: MTS-DEC-003, area: delivery, key: project_mode, value: greenfield, status: observed, source: repository_inspection, rationale: "No application repository, package manifest, runtime configuration, or deployment configuration exists in the supplied workspace."}
    - {id: MTS-DEC-004, area: data, key: demo_data_posture, value: synthetic_only, status: observed, source: [MPS-RULE-001, MPS-RULE-004], rationale: "R1 forbids production credentials, customer data, and buyer uploads."}
    - {id: MTS-DEC-005, area: delivery, key: cost_scale_posture, value: "$50/month lean launch with incremental scaling", status: approved, source: "Josh Gate 1 approval", rationale: "Avoid speculative capacity while preserving a practical growth path.", approved_at: "2026-09-05"}
    - {id: MTS-DEC-006, area: privacy, key: inquiry_retention, value: "12 months after latest activity; earlier manual deletion; minimal operational deduplication metadata afterward", status: approved, source: "MPS v1.1 / Josh Gate 1 approval", rationale: "Balance freelance follow-up with data minimization.", approved_at: "2026-09-05"}
    - {id: MTS-DEC-007, area: delivery, key: repository_posture, value: "standalone Git repository with preview and production environments", status: approved, source: "Josh Gate 1 approval", rationale: "Keep the lab independently deployable and preserve the full handoff package.", approved_at: "2026-09-05"}
  gaps:
    - {id: MDS-GAP-S1-001, owner: MDS, area: design_accessibility, statement: "border.default (#D6DEE7) measures 1.36:1 against surface.base. Where that border is the only boundary identifying a control - the secondary button, and the form inputs S5 will add - it is below the 3:1 WCAG 2.2 AA 1.4.11 non-text contrast threshold.", observed_at: "2026-09-06", stage: S1, evidence: "Measured contrast audit; all 43 other measured pairs pass.", mitigation_in_s1: "Secondary controls also carry a 17.74:1 text label and a 5.17:1 focus ring, so they remain identifiable and operable. The approved token was used as specified and was not altered.", status: open_awaiting_mds_decision}
    - {id: MDS-GAP-S1-002, owner: MDS, area: evidence_vocabulary, statement: "No distinct symbol is defined for the warning state ('Review required'). COMPONENTS-PROPOSAL assigns it alert-circle, which is the same shape the references use for vulnerable.", observed_at: "2026-09-06", stage: S1, status: open_awaiting_mds_decision}
    - {id: MTS-GAP-001, owner: MPS, area: privacy, statement: "Inquiry retention and deletion policy is not defined.", status: resolved, resolution: "MPS v1.1 limits inquiry content to 12 months after latest activity, permits earlier deletion, and allows only minimal operational deduplication metadata afterward."}
    - {id: MTS-GAP-002, owner: MTS, area: delivery_constraints, statement: "R1 cost ceiling and initial traffic assumption require owner approval.", status: resolved, resolution: "Josh approved the $50/month lean-launch posture with incremental scaling."}
    - {id: MTS-GAP-003, owner: implementation, area: repository, statement: "The approved standalone Git repository and baseline branch have not yet been created.", status: resolved, resolution: "Josh created the standalone GitHub repository; Codex prepared the canonical governance-only baseline on main before application implementation."}
  risks:
    - {id: MTS-RISK-001, area: security, statement: "A deliberately vulnerable demo could expose an exploitable public path if vulnerable behavior is implemented as an unrestricted live backend.", severity: critical, status: controlled_pending_owner_review, controlled_at: "2026-09-06", control: "S2 removes the possibility rather than guarding it. The vulnerable policy set exists only in supabase/migrations and runs only in the offline recorder against an isolated local container. The deployed application imports no database client at all (verified by grep over app/, components/, lib/), the built output contains no connection string (verified by grep over .next/), and the single server entry point accepts nothing but an allowlisted scenario id and one of two documented mode names. A crafted POST to that Server Action can only read evidence the page already renders, or be rejected.", residual: "The control depends on the application never gaining a runtime database client. S5 adds a Supabase client for inquiries and must keep it on a separate path from the evidence engine."}
    - {id: MTS-RISK-002, area: evidence_integrity, statement: "Precomputed or non-deterministic evidence could undermine buyer trust if it is presented as a real test run.", severity: high, status: controlled_pending_owner_review, controlled_at: "2026-09-06", control: "The evidence IS precomputed, and S2 says so rather than hiding it. Every panel caption names the recording time, the engine (PostgreSQL 17.6), the isolated local host, and a sha256 digest of the migrations and test set that produced it; the scenario limitation states plainly that the published application holds no database connection and replays a recorded transcript. Determinism is enforced, not asserted: pnpm evidence:verify re-records twice from a clean database and fails if the result differs from the committed transcript by anything other than the wall-clock timestamp.", residual: "A buyer could still read the replay as a live run if the provenance line is ever dropped from a panel. The caption is a required prop on the evidence panel, so it cannot be omitted silently."}
    - {id: MTS-RISK-003, area: privacy, statement: "Inquiry storage, logs, analytics, or delivery could retain more personal data than the portfolio use requires.", severity: high, status: open}
    - {id: MTS-RISK-004, area: scope, statement: "Adding real payment processing or live-target scanning would violate R1 and increase security and operational burden.", severity: high, status: controlled_by_mps}
    - {id: MTS-RISK-005, area: agent_delivery, statement: "Assuming a skill available in Codex also works in Claude could make the implementation playbook non-executable.", severity: medium, status: closed, closed_at: "2026-09-06", resolution: "P0 verification enumerated the Claude skill roster directly. No MTS-named skill exists in Claude, so the risk is confirmed real, but every required skill (MTS-SKL-001/002/003) has a manifest-approved fallback that was verified present and working: project-local MTS artifacts, Next.js docs bundled at node_modules/next/dist/docs, and Playwright 1.63.0 with installed browsers. The playbook is executable in Claude on fallbacks. Owner ruling: manifest environment tags are Codex-side authoring metadata and are not corrected here."}
  exceptions:
    - {id: MTS-EXC-001, area: repository_layout, approved_by: Josh Coley, approved_at: "2026-09-06", statement: "The application is flattened to the repository root (app/, e2e/) rather than the src/app/ and tests/ paths planned in INTEGRATION-MANIFEST.md and IMPLEMENTATION-PLAN.md.", rationale: "Owner accepted the flattened layout established in commit 06f7a57; it does not change the approved architecture, server/client boundaries, or any security control.", impact: "Planned-path columns in mts/INTEGRATION-MANIFEST.md and the layout block in mts/IMPLEMENTATION-PLAN.md read src/-prefixed; implementation uses the root-relative equivalents (app/, lib/, e2e/). Traceability is otherwise unchanged.", status: approved}
    - {id: MTS-EXC-002, area: browser_verification, approved_by: Josh Coley, approved_at: "2026-09-06", statement: "WebKit browser verification runs in CI only and is not executed on the workstation.", rationale: "WebKit needs 121 system packages on this Ubuntu 26.04 host; owner declined local installation. Binaries are installed and the project is enabled by PLAYWRIGHT_WEBKIT=1.", impact: "Local browser evidence covers Chromium (4 viewport projects) and Firefox. WebKit evidence depends on the S6 CI workflow, which is not yet wired.", status: approved}
  deviations:
    - {id: MTS-DEV-001, at: "2026-09-06", stage: S1, area: visual_reference, statement: "The landing hero evidence snapshot and the report-preview severity table and RLS matrix excerpt shown in MDS-REF-002 are not populated in S1.", rationale: "Both regions read from documented finding and evidence data that does not exist before S2-S4. Populating them now would require inventing findings, which MPS-RULE-007 and the reference authority rule prohibit.", implemented_instead: "The hero renders the approved Synthetic SaaS context panel (MDS-REF-005, MPS-REQ-002); the report preview renders the approved report-route band (MDS-REF-005) with no fabricated finding.", resolution_slice: S4, status: open_awaiting_owner_decision}
    - {id: MTS-DEV-002, at: "2026-09-06", stage: S1, area: route_completeness, statement: "/report, /inquiry, and /scenarios/[slug] exist from S1 and render a build-state notice instead of their approved content.", rationale: "MDS responsive.rules.visibility forbids hiding the report route or the primary CTA, and MPS-ACC-010 requires the report to be reachable without completing a scenario. Broken navigation targets were judged worse than an explicit, honest not-published state.", implemented_instead: "A shared notice composed from the approved alert, card, and status-indicator components. It states the canonical untested evidence state, says plainly that no documented test has been run, and offers recovery routes. It uses no evidence vocabulary that would imply a retrieved-but-unavailable result.", resolution_slice: "S2, S4, S5", status: partially_resolved, resolution_progress: "S2 resolves the scenario route for the two published scenarios: /scenarios/authorization-and-rls and /scenarios/storage-and-configuration now render the guided lab with real recorded evidence. /scenarios/webhook-integrity and /scenarios/reliability-and-recovery keep the honest untested notice until S3, and /report and /inquiry keep theirs until S4 and S5."}
  observations:
    - {id: MTS-OBS-001, at: "2026-09-06", stage: S1, area: visual_reference, statement: "MDS-REF-002 renders a five-step service process labelled Align / Run scenarios / Analyze / Report / Plan. S1 uses the approved written vocabulary Context -> Vulnerable proof -> Remediation -> Repeated test -> Limitation.", authority: "DESIGN-SYSTEM.md section 11 locks the stepper vocabulary; COMPOSITION-PROPOSAL defines the landing 'How the proof works' section with the same five steps; the Gate 5 reconciliation replaced exactly that unapproved stepper in the component library. Written MDS governs over the reference image."}
    - {id: MTS-OBS-002, at: "2026-09-06", stage: S1, area: open_mts_decision, statement: "MDS records icons.implementation as mts_to_select and the approved technology set names no icon package. S1 inlines the required glyphs as SVG rather than selecting an unapproved dependency.", correction: "Owner review on 2026-09-06 found the first S1 icon set did not match the approved references. Each glyph was re-cut against zoomed crops of MDS-REF-002, MDS-REF-003 and MDS-REF-005 using the Lucide outline geometry the references render, and two substantive mismatches were fixed: Reliability and recovery uses the clock on scenario cards (MDS-REF-005) and the gear on the landing pillar row (MDS-REF-002); evidence state moved from outline icons to the filled semantic badge with a knocked-out glyph that every canonical reference shows.", requires: "MTS decision to confirm the inline set or approve a package before the icon surface grows in S2-S4."}
    - {id: MTS-OBS-003, at: "2026-09-06", stage: S1, area: design_accessibility, statement: "The approved references render scenario and pillar icons in per-pillar hues (green, green, purple, orange in MDS-REF-005). The approved palette contains no purple or orange token, so S1 renders all pillar and scenario icons in brand.primary.", authority: "Hardcoding a colour with no approved token is prohibited by mds/specification/DO-DONT.md. Icon colour carries no state meaning here, so nothing is lost."}
    - {id: MTS-OBS-004, at: "2026-09-06", stage: S1, area: design_accessibility, statement: "The vulnerable and warning evidence states resolve to the same filled circle-with-exclamation shape in different semantic hues, so shape alone does not separate them.", mitigation: "Both states always render their exact canonical label and explanation adjacent to the badge, which the MDS requires, so meaning never rests on colour or shape alone.", requires: "MDS decision if a distinct warning symbol is wanted; recorded as MDS-GAP-S1-002."}
    - {id: MTS-OBS-005, at: "2026-09-06", stage: S2, area: evidence_provenance, statement: "The lab presents RECORDED evidence, not a live query. Real SQL runs against a real isolated PostgreSQL 17.6 fixture in the offline recorder; the transcript of that run is committed and the published application replays it. The application opens no database connection.", rationale: "This is what the MTS vulnerable-demonstration rule asks for - evidence from a bounded fixture or test harness, deterministic and resettable - and it is the only shape in which a public site can show a genuine cross-tenant failure without hosting one.", disclosure: "Stated in every evidence caption (recording time, engine, host, fixture digest) and in the scenario limitation, so no buyer can mistake a replay for a live run.", requires: "Owner confirmation that recorded-and-disclosed is the intended posture for the public lab."}
    - {id: MTS-OBS-006, at: "2026-09-06", stage: S2, area: visual_reference, statement: "MDS-REF-003 and MDS-REF-006 render the code/log excerpt tabs as Test output | SQL | Request | Response. S2 renders Test output | SQL | Verification | Response.", authority: "The reference is authoritative for what it clearly shows, and its illustrative labels are not product data. A documented test here is a SQL statement executed against the fixture as a database role; there is no HTTP request to show, so a Request tab could only be filled by inventing one. Verification replaces it and carries something real: the read-back of stored rows after a write, which is what proves whether a cross-tenant write actually persisted."}
    - {id: MTS-OBS-007, at: "2026-09-06", stage: S2, area: evidence_vocabulary, statement: "The MDS-REF-006 matrix legend reads Covered / Not tested / Partial / Not applicable. S2 uses the canonical DESIGN-SYSTEM section 9 vocabulary instead: Remediated - documented test blocked / Vulnerable - test succeeded unexpectedly / Untested / Not applicable.", authority: "COMPONENTS-PROPOSAL requires matrix cells to use the canonical evidence-state component, and section 9 forbids paraphrasing those labels. Covered and Partial are not approved states, and Covered in particular reads as an unqualified pass, which MPS-RULE-002 and MPS-ACC-005 prohibit."}
    - {id: MTS-OBS-008, at: "2026-09-06", stage: S2, area: data_architecture, statement: "The canonical references show fixture tables as public.profiles, org_members, invoices and storage.objects. S2 creates them in a dedicated `synthetic` schema as synthetic.profiles, synthetic.org_members, synthetic.invoices and synthetic.storage_objects.", authority: "Reference table names are illustrative. The isolation requirement is not: the fixture must stay provably separate from the inquiry store S5 adds to public. A dedicated schema makes that boundary checkable rather than conventional - synthetic.reset_fixture() names its five tables literally, uses no dynamic SQL, and a test proves a row in public survives a reset. synthetic.storage_objects is a metadata-only stand-in for storage.objects and stores no file content."}
    - {id: MTS-OBS-009, at: "2026-09-06", stage: S2, area: engineering_finding, statement: "Two PostgreSQL behaviours were established by running the fixture, and both change what a correct RLS review must check. (1) Omitting WITH CHECK on an UPDATE policy is not a vulnerability: PostgreSQL reuses the USING expression as the check. (2) A widened WITH CHECK is still not sufficient to escalate on its own: when a SELECT policy exists, PostgreSQL also tests the new row against it for any UPDATE that reads, so a tenant-scoped read policy blocks the write even when the check says true.", impact: "The first draft of the vulnerable fixture reproduced neither. Both were corrected against actual recorded output rather than assumption, and the second is now surfaced to the buyer as remediation guidance.", note: "Recorded because it is the kind of finding the service exists to produce, and because it shows the evidence was not written to a predetermined answer."}
    - {id: MTS-OBS-010, at: "2026-09-06", stage: S2, area: component_extension, statement: "components/ui/button.tsx gained an opt-in `disableWhileLoading` prop, default true so S1 behaviour is unchanged.", rationale: "Disabling the control the buyer just activated makes the browser drop focus to the body, which breaks the approved interaction rule that focus moves only after deliberate navigation, submission, or recovery. The three guided-lab run controls opt out, stay focusable, and are marked aria-disabled and aria-busy while the replay is in flight; re-entry is guarded in the handler. Caught by a Playwright focus assertion, not by inspection."}
    - {id: MTS-OBS-011, at: "2026-09-06", stage: S2, area: security_boundary, statement: "The fixture simplifies IDENTITY, not authorization. A real Supabase policy calls auth.uid(), which reads a signed JWT the caller cannot forge; the fixture has no auth service and carries the acting member in a transaction-local GUC that any session holding a database connection could set.", assessment: "Not exploitable as built. The policies under test are ordinary PostgreSQL row level security and behave exactly as they would against auth.uid(); only the identity source differs. Nothing but the offline recorder ever connects - the database runs in a local container and the deployed application holds no database client - so no caller can assert an identity.", constraint: "This fixture must never be exposed to a public network or reused as an application backend. Recorded in the migration alongside the function so the constraint travels with the code."}
    - {id: MTS-OBS-012, at: "2026-09-06", stage: S2, area: security_review, statement: "A security review of the S2 diff produced no finding at reportable confidence.", scope: "Checked: injection reachability into the dynamic-SQL harness, the Server Action input boundary, SECURITY DEFINER search_path handling and grants, XSS sinks in the new components, client-bundle leakage, and credential exposure in source, build output, logs, and the recorded transcript.", hardened_anyway: "Two items were tightened without being findings: the recorder now passes the mode and case identifier as psql variables instead of interpolating them into SQL strings, and the fixture identity boundary is documented at the function that defines it (MTS-OBS-011)."}
    - {id: MTS-OBS-013, at: "2026-09-06", stage: S2, area: responsive_layout, statement: "Three real responsive defects were found by measuring page scroll rather than by inspection, and all three are fixed.", detail: "(1) Tailwind's sr-only is position:absolute; with no positioned ancestor those spans resolve against the initial containing block, so the matrix cells' screen-reader state text landed far right of a horizontally scrolled table and made the whole PAGE scroll sideways by up to 206px. Fixed by establishing a containing block on the matrix scroller and the code-excerpt panel. (2) Flex and grid items default to min-width:auto, letting a wide code line or table widen its ancestors instead of scrolling inside its own container; min-w-0 was added along the chain from main downwards. (3) At 320px the run controls exceeded the content column because the shared button sets whitespace-nowrap; the three lab controls now wrap instead, with no label shortened.", verified: "No horizontal page scroll on either published scenario, in both the untested and the fully run state, at 320, 360, 390, 640, 768, 960, 1280 and 1440px."}
    - {id: MTS-OBS-014, at: "2026-09-06", stage: S2, area: verification_integrity, statement: "An earlier S2 verification run reported 236 passed against a STALE server build, because a kill in the restart chain failed silently and the new server could not take the port. Those numbers were discarded.", correction: "The suite was re-run against a from-clean rebuild with the running build confirmed first. On that build 13 real failures appeared - the horizontal-overflow defects in MTS-OBS-013 and a contrast-measurement gap - none of which the stale run could see.", lesson: "A green suite is only evidence if the build under test is confirmed to be the build being reported. Recorded so the S3 checkpoint does not repeat it."}
    - {id: MTS-OBS-015, at: "2026-09-06", stage: S2, area: accessibility_tooling, statement: "The measured contrast helper now skips nodes clipped to a 1px box (the sr-only pattern).", rationale: "Such text reported 1.00:1 against whatever sat behind it while being unreadable by definition. WCAG 1.4.3 governs perceivable text, and measuring screen-reader-only strings would have reported 19 failures no sighted user can encounter - and would have pushed toward deleting the very text that carries evidence state non-visually. The helper was extracted to e2e/contrast.ts so S1 and S2 share one implementation."}
  changes:
    - {id: MTS-CHG-004, at: "2026-09-06", by: Claude, stage: S2, summary: "Implemented S2, the deterministic bounded evidence engine and RLS proof, on branch slice/s2-evidence-rls. Added the synthetic multi-tenant fixture, the two documented policy modes, the offline documented-test harness and recorder, the committed evidence transcript, the bounded server-side executor, and the guided lab with evidence panels, per-test before/after comparison, and the RLS coverage matrix. Moved current_phase and current_slice to S2, recorded S1 as approved and completed, moved MTS-RISK-001 and MTS-RISK-002 to controlled, and opened MTS-OBS-005 through MTS-OBS-015.", authority: "Owner instruction 2026-09-06 to proceed with Slice 2 only", scope_note: "S2 status and roadmap position only. No capability, architecture, security, provider, or approved-selection decision was changed; mts_version remains v0.6-draft. No webhook replay, report, inquiry capture, notification, authentication, or billing was implemented. No dependency was added: the fixture harness uses the already-approved Supabase CLI and psql, and the unit tests run on the already-approved Playwright Test."}
    - {id: MTS-CHG-003, at: "2026-09-06", by: Claude, stage: S1, summary: "Acted on owner S1 feedback: re-cut the icon set against zoomed crops of the canonical references, moved evidence state to the approved filled-badge treatment, corrected the reliability scenario icon to the clock, ran a measured contrast audit and fixed three AA failures of my own composition, added a browser-measured contrast check to the S1 suite, and opened MDS-GAP-S1-001 and MDS-GAP-S1-002.", authority: "Owner instruction 2026-09-06", scope_note: "S1 scope only. No approved token value was changed; the two contrast findings that trace to approved tokens are reported as MDS gaps rather than silently altered."}
    - {id: MTS-CHG-002, at: "2026-09-06", by: Claude, stage: S1, summary: "Implemented S1, the public MDS shell and scenario navigation, on branch slice/s1-public-mds-shell. Moved current_phase and current_slice to S1, recorded P0 as a completed slice, and opened MTS-DEV-001, MTS-DEV-002, MTS-OBS-001, and MTS-OBS-002.", authority: "Owner instruction 2026-09-06 to proceed with Slice 1 only", scope_note: "S1 status and roadmap position only. No capability, architecture, security, provider, or approved-selection decision was changed; mts_version remains v0.6-draft. No evidence execution, inquiry persistence, authentication, or billing was implemented."}
    - {id: MTS-CHG-001, at: "2026-09-06", by: Claude, stage: P0, summary: "Refreshed stale delivery facts (workspace path, git repository presence, runtime versions, framework initialization, package scripts), recorded the observed Claude skill inventory and environment-variable contract, added .env.example as the environment contract, opened current_phase P0, closed MTS-RISK-005, and recorded MTS-EXC-001 and MTS-EXC-002.", authority: "Owner instruction 2026-09-06", scope_note: "Delivery and governance bookkeeping only. No capability, architecture, security, or approved-selection decision was changed; mts_version remains v0.6-draft."}
