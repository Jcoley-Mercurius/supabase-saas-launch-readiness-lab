    - {id: MTS-DEC-006, area: privacy, key: inquiry_retention, value: "12 months after latest activity; earlier manual deletion; minimal operational deduplication metadata afterward", status: approved, source: "MPS v1.1 / Josh Gate 1 approval", rationale: "Balance freelance follow-up with data minimization.", approved_at: "2026-09-05"}
    - {id: MTS-DEC-011, area: verification, key: browser_suite_server, value: "always build and serve the production build; never reuse an existing server", status: approved, source: "Josh Coley owner direction 2026-09-07, answering the residual question left open in MTS-OBS-027", approved_at: "2026-09-07", rationale: "playwright.config.ts served `pnpm dev` unless CI was set, so every workstation browser run in this project exercised a development build while CI exercised production - two different artifacts reported under one set of numbers. It also reused any server already on the port, which is precisely how MTS-OBS-014 happened. Verification evidence is worth having only if the build under test is known.", consequence: "Local runs now pay a production build per run and start their own server. That cost is accepted: the alternative is browser evidence that cannot be trusted. The webServer timeout rises from 120s to 240s to cover the build.", supersedes: "The CI-only production build described in MTS-OBS-027; CI behaviour is unchanged, local behaviour now matches it."}
    - {id: MTS-DEC-010, area: data_security, key: fixture_signature_algorithm, value: "HMAC-SHA256 via the pgcrypto extension", status: approved, source: "Josh Coley owner direction at the S3 checkpoint, 2026-09-07, choosing the pgcrypto option over keeping the disclosed md5 stand-in or deferring it to S6", approved_at: "2026-09-07", rationale: "Enabling a PostgreSQL extension changes the approved data layer and is a technology decision rather than an implementation detail, so it was put to the owner rather than taken. pgcrypto ships with the Supabase image and is already installed in the extensions schema on both the workstation and the pinned CLI 2.111.0 used in CI, so it adds no vendor, no dependency, and no cost. The demonstrated control was always that the receiver recomputes and refuses a mismatch, and md5 was adequate for that - but a security lab showing md5 in a signature demonstration spends buyer credibility for no gain, and the fix is one schema-qualified function body.", consequence: "The buyer-facing limitation narrows from a statement about the algorithm to a statement about fixture scope: invented signing material and this fixture's own canonical string, rather than a provider's documented signing format. See MTS-OBS-024.", alternatives_not_taken: "Keeping the disclosed md5 stand-in was honest but avoidably weak. Deferring to S6 would have shipped the weaker artifact through the checkpoint for no benefit, since the change is small and fully covered by the existing determinism gates."}
    - {id: MTS-DEC-012, area: data_security, key: inquiry_store_verification, value: "Build the inquiry schema as a separate migration set and verify it against an isolated local database; the hosted isolated Supabase project is created by the owner later", status: approved, source: "Josh Coley owner decision 2026-09-08 at the S5 pre-implementation checkpoint", approved_at: "2026-09-08", rationale: "NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY were unset, so the alternative was to ship persistence verified only against an in-process fake. Verifying against a real PostgreSQL database produced real allow/deny, deduplication, abuse-control, and retention evidence, and found one real defect (MTS-OBS-041)."}
    - {id: MTS-DEC-013, area: operations, key: inquiry_retention_mechanism, value: "A SQL redaction function invoked by an operator command (pnpm inquiries:retain), not pg_cron and not an opportunistic sweep on the buyer's request path", status: approved, source: "Josh Coley owner decision 2026-09-08 at the S5 pre-implementation checkpoint", approved_at: "2026-09-08", rationale: "MTS-CAP-012 carried approved_selection: null, so the execution mechanism was undecided and could not be invented. This adds no extension, no service, and no latency to a submission, and it is fully testable before the hosted project exists. Scheduling remains an owner action (MTS-OBS-039)."}
    - {id: MTS-DEC-016, area: analytics, key: measurement_destination, value: "First-party only: bounded events counted into the project's own Supabase Postgres, with no third-party analytics provider", status: approved, source: "Josh Coley owner decision 2026-09-09", approved_at: "2026-09-09", rationale: "MTS-CAP-008 had carried approved_selection: null since Gate 5, so MPS-MET-001 through MPS-MET-005 had no means of collection at all. The first-party event boundary was already approved in TECHNOLOGY-BLUEPRINT.md; what was never decided was the destination behind it. First-party keeps the decision consistent with the product's own subject: a launch-readiness demonstration that shipped a third-party tracker would have to defend cookies, consent, and a data-sharing surface on the very page arguing for restraint. It also adds no vendor, no account, and no cost.", alternatives_not_taken: "PostHog was the blueprint's conditional candidate and offers funnels and retention without being built; it was declined for the vendor, consent, and privacy surface it brings. Vercel Web Analytics was declined because MPS-MET-002 (scenario completion) and MPS-MET-003 (qualified inquiry conversion) need custom funnel events it handles weakly. Deferring measurement out of R1 was declined because the owner chose to collect the baseline the metrics are waiting on.", cost_accepted: "No ready-made dashboard. The events are queried directly, and any reporting view is work this project does itself.", binding_constraint: "The boundary strips inquiry text, secrets, credentials, and raw evidence payloads before persistence, and no measurement row may carry a value that identifies a person. This holds regardless of destination and is unchanged by this decision."}
    - {id: MTS-DEC-015, area: operations, key: inquiry_retention_scheduling, value: "A monthly GitHub Actions workflow (.github/workflows/retention.yml) invokes `pnpm inquiries:retain`", status: approved, source: "Josh Coley owner decision 2026-09-08", approved_at: "2026-09-08", rationale: "MTS-DEC-013 chose the mechanism but left nothing running it, so MPS-REQ-015 was satisfied by capability rather than by process. GitHub Actions was chosen over pg_cron because CI is already wired there, the run is logged and auditable, and it could be built and reviewed before the isolated Supabase project exists. The cost accepted: the inquiry database connection string becomes a repository secret.", control: "Schedule and dispatch triggers only, a no-op without the secret, counts printed rather than content, and a dry run before the real pass."}
    - {id: MTS-DEC-014, area: integrations, key: inquiry_notification_live_test, value: "Build and unit-test the Resend boundary against an injected transport; send no real message without a second explicit owner confirmation", status: approved, source: "Josh Coley owner decision 2026-09-08 at the S5 pre-implementation checkpoint", approved_at: "2026-09-08", rationale: "The credentials were configured, but a real send is an outbound action to a real destination. The owner chose to gate it separately, so S5 carries a truthfully unverified delivery half (MTS-OBS-042) rather than an unrequested outbound message."}
    - {id: MTS-DEC-009, area: delivery, key: ci_provider, value: "GitHub Actions", status: approved, source: "Josh Coley owner instruction 2026-09-06 to wire the S6 CI requirement, 'whatever needs to happen'", approved_at: "2026-09-06", rationale: "MTS-CAP-011 carried approved_selection: null, so a CI provider had never been selected and this is a technology decision rather than an implementation detail. GitHub Actions adds no vendor, no account, and no cost beyond the free tier: the approved repository posture (MTS-DEC-007) already puts the canonical remote on GitHub, and the workflow needs no secret because the lab holds no database connection and the fixture is synthetic and built on the runner.", alternatives_not_taken: "A separate CI vendor would add an account and an integration for no capability gain. Running verification only on the workstation was rejected because it cannot produce WebKit evidence (MTS-EXC-002) and because MTS-RISK-006 requires a stale transcript to fail a gate rather than depend on a person remembering.", confirmed_by: Josh Coley, confirmed_at: "2026-09-07", confirmation_note: "Owner approved the GitHub Actions selection explicitly at the S2 checkpoint. MTS-CAP-011 no longer carries a null approved_selection for the CI concern; preview, production, release and rollback controls remain unprovisioned and owner-gated at S6."}
    - {id: MTS-DEC-008, area: evidence_provenance, key: evidence_posture_r1, value: "recorded and disclosed; no live scanning", status: approved, source: "Josh Coley owner decision on the S2 checkpoint", approved_at: "2026-09-06", rationale: "The lab exists to demonstrate review methodology, not to run a scanner. A committed transcript plus the committed migrations and documented tests that produced it is auditable by anyone who clones the repository, whereas a live vulnerable endpoint would be less verifiable to a technical buyer and would collide with the SECURITY-ARCHITECTURE vulnerable-demonstration rule, require rebuilding fixture identity on real Supabase auth (MTS-OBS-011), and add a public abuse surface.", boundary: "A live audit is an engagement conducted directly with the owner outside the public product. R1 adds no live scanning, no buyer-supplied target, and no runtime database connection in the deployed application.", forward_looking: "Live capability may be reconsidered in R2/R3. It would be an MPS scope change and an MTS re-gate, not an implementation choice, and the recorded posture is additive to it - a live mode could later sit beside the replay, whereas starting live would contaminate the deployment with credentials and a connection.", applies_to: "S3 and S4 proceed on the recorded posture: S3 records webhook replay and recovery evidence through the same offline recorder shape as S2."}
    - {id: MTS-DEC-007, area: delivery, key: repository_posture, value: "standalone Git repository with preview and production environments", status: approved, source: "Josh Gate 1 approval", rationale: "Keep the lab independently deployable and preserve the full handoff package.", approved_at: "2026-09-05"}
  gaps:
    - {id: MDS-GAP-S4-001, owner: MDS, area: print_appearance, statement: "The approved MDS requires the report to remain readable and printable without interactive controls or dark-page backgrounds (DESIGN-SYSTEM.md section 13, COMPOSITION-PROPOSAL audit report shell, MDS-QA gate 2 REF-007), but defines no print appearance: no print token values, no treatment for the dark evidence surface on paper, and no rule for which screen controls are dropped.", observed_at: "2026-09-07", stage: S4, status: resolved, resolved_at: "2026-09-07", resolution: "Confirmed by Josh Coley on 2026-09-07. The implemented treatment IS the approved print appearance: the print medium redefines the approved tokens rather than introducing any print-only value, and the anchor-based section index, the copy button, and unselected excerpt tabs are the confirmed set of controls dropped on paper. No code changed to close it - the gap was that the MDS had no decision on record, and now it does. Recorded in the MDS state as MDS-CHG-003.", implemented_meanwhile: "The requirement is implemented without inventing a value. The print block in app/globals.css REDEFINES THE APPROVED TOKENS for the print medium - surface.ink and surface.evidence resolve to white, text.inverse to text.strong - so every utility built on them follows and the type scale, spacing, radii, and borders are untouched. No print-only colour is introduced. Beyond that it only restores completeness (nothing clipped, scrolled, or collapsed), standard pagination, and removal of the three controls that cannot function on paper: the anchor-based section index, the copy button, and unselected excerpt tabs. Nothing carrying evidence, state, limitation, recovery, or the CTA is removed.", verification: "Three browser checks run in the print medium itself rather than reading the stylesheet: no surface darker than 0.35 relative luminance survives, no element still clips or caps its height, and every finding, its reproduction evidence and its limitation still render.", requires_resolved: "The MDS decision this gap required was given on 2026-09-07.", mirrored_to: "mds/MDS-PROJECT-STATE.yaml governance.gaps, on owner instruction 2026-09-07 (MDS-CHG-002). That record is the design authority; this one is where the gap was opened. Both state the same gap and both remain open."}
    - {id: MDS-GAP-S1-001, owner: MDS, area: design_accessibility, statement: "border.default (#D6DEE7) measures 1.36:1 against surface.base. Where that border is the only boundary identifying a control - the secondary button, and the form inputs S5 will add - it is below the 3:1 WCAG 2.2 AA 1.4.11 non-text contrast threshold.", observed_at: "2026-09-06", stage: S1, evidence: "Measured contrast audit; all 43 other measured pairs pass.", mitigation_in_s1: "Secondary controls also carry a 17.74:1 text label and a 5.17:1 focus ring, so they remain identifiable and operable. The approved token was used as specified and was not altered.", status: resolved, resolved_at: "2026-09-06", resolution: "Owner approved color.border.control = #667085 (4.97:1 on surface.base), applied to the secondary button. Decorative borders keep border.default. Recorded as MDS-CHG-001."}
    - {id: MDS-GAP-S1-002, owner: MDS, area: evidence_vocabulary, statement: "No distinct symbol is defined for the warning state ('Review required'). COMPONENTS-PROPOSAL assigns it alert-circle, which is the same shape the references use for vulnerable.", observed_at: "2026-09-06", stage: S1, status: resolved, resolved_at: "2026-09-06", resolution: "Owner approved the COMPONENTS-PROPOSAL shapes - vulnerable alert-triangle, warning alert-circle, unavailable cloud-off - in the approved filled-badge treatment. All seven evidence states now differ by silhouette or mark. Recorded as MDS-CHG-001.", correction: "Verified against the shipped code on 2026-09-06 and this statement is stale: vulnerable and warning are already distinct (circle in danger, triangle in warning). The live collision is warning against unavailable, which render identically. See MTS-OBS-017 for what is actually true and a resolution that needs no new MDS value."}
    - {id: MTS-GAP-001, owner: MPS, area: privacy, statement: "Inquiry retention and deletion policy is not defined.", status: resolved, resolution: "MPS v1.1 limits inquiry content to 12 months after latest activity, permits earlier deletion, and allows only minimal operational deduplication metadata afterward."}
    - {id: MTS-GAP-002, owner: MTS, area: delivery_constraints, statement: "R1 cost ceiling and initial traffic assumption require owner approval.", status: resolved, resolution: "Josh approved the $50/month lean-launch posture with incremental scaling."}
    - {id: MTS-GAP-003, owner: implementation, area: repository, statement: "The approved standalone Git repository and baseline branch have not yet been created.", status: resolved, resolution: "Josh created the standalone GitHub repository; Codex prepared the canonical governance-only baseline on main before application implementation."}
  risks:
    - {id: MTS-RISK-001, area: security, statement: "A deliberately vulnerable demo could expose an exploitable public path if vulnerable behavior is implemented as an unrestricted live backend.", severity: critical, status: controlled_pending_owner_review, controlled_at: "2026-09-06", recontrolled_at: "2026-09-08", control: "S2 removes the possibility rather than guarding it. The vulnerable policy set exists only in supabase/migrations and runs only in the offline recorder against an isolated local container. The evidence engine imports no database client at all, the built output contains no connection string, and the single server entry point accepts nothing but an allowlisted scenario id and one of two documented mode names. A crafted POST to that Server Action can only read evidence the page already renders, or be rejected.", residual_addressed_at: "2026-09-08", residual_control: "S5 adds the runtime database client the residual predicted, and confines it. lib/inquiry/store.ts is the only module in the repository that constructs one; it carries the server-only guard, reads the publishable key and never a service-role key, and reaches no table at all - every privilege on both inquiry tables is revoked and RLS is enabled with no policy, so its entire reach is two SECURITY DEFINER functions that take a closed set of scalars and return no inquiry content. The separation is enforced rather than asserted: tests/unit/inquiry-boundary.spec.ts walks the static import graph of lib/evidence and lib/inquiry and fails if either reaches the other, if the evidence engine acquires a database client or connection string, if a credential is read outside the two approved modules, if a service-role key is read anywhere, or if a second module constructs a client.", residual: "The control now depends on that boundary test remaining in the check chain. Removing or weakening it re-opens the risk, and any future runtime client must be added to lib/inquiry or be a new MTS decision."}
    - {id: MTS-RISK-002, area: evidence_integrity, statement: "Precomputed or non-deterministic evidence could undermine buyer trust if it is presented as a real test run.", severity: high, status: controlled_pending_owner_review, controlled_at: "2026-09-06", control: "The evidence IS precomputed, and S2 says so rather than hiding it. Every panel caption names the recording time, the engine (PostgreSQL 17.6), the isolated local host, and a sha256 digest of the migrations and test set that produced it; the scenario limitation states plainly that the published application holds no database connection and replays a recorded transcript. Determinism is enforced, not asserted: pnpm evidence:verify re-records twice from a clean database and fails if the result differs from the committed transcript by anything other than the wall-clock timestamp.", residual: "A buyer could still read the replay as a live run if the provenance line is ever dropped from a panel. The caption is a required prop on the evidence panel, so it cannot be omitted silently."}
    - {id: MTS-RISK-006, area: evidence_integrity, statement: "A committed transcript can go stale against the fixture that produced it. An edited migration or documented test with no re-recording would leave the lab replaying evidence to buyers under a provenance line that no longer describes it, which is the one way the recorded-and-disclosed posture (MTS-DEC-008) becomes untruthful.", severity: high, status: controlled, controlled_at: "2026-09-06", control: "scripts/check-evidence-freshness.mjs recomputes the input digest from supabase/migrations and supabase/tests/documented-tests.sql and fails if it differs from the digest stamped in the committed transcript. It also rejects a transcript that does not parse, does not record both documented policy modes, or matches a credential-shaped pattern. It needs no database, so it runs in `pnpm check`, in `pnpm test:unit` (tests/unit/evidence-freshness.spec.ts), and as the first step of the database-backed `pnpm evidence:verify`. The gate was proved to fail, not assumed to: appending one comment line to the documented test set turned it red with the drifted digest named.", residual: "Full re-recording still requires PostgreSQL and therefore a workstation or the S6 CI job (MTS-OBS-016). The freshness gate detects that a re-recording is owed; it cannot perform one."}
    - {id: MTS-RISK-003, area: privacy, statement: "Inquiry storage, logs, analytics, or delivery could retain more personal data than the portfolio use requires.", severity: high, status: open}
    - {id: MTS-RISK-004, area: scope, statement: "Adding real payment processing or live-target scanning would violate R1 and increase security and operational burden.", severity: high, status: controlled_by_mps}
    - {id: MTS-RISK-005, area: agent_delivery, statement: "Assuming a skill available in Codex also works in Claude could make the implementation playbook non-executable.", severity: medium, status: closed, closed_at: "2026-09-06", resolution: "P0 verification enumerated the Claude skill roster directly. No MTS-named skill exists in Claude, so the risk is confirmed real, but every required skill (MTS-SKL-001/002/003) has a manifest-approved fallback that was verified present and working: project-local MTS artifacts, Next.js docs bundled at node_modules/next/dist/docs, and Playwright 1.63.0 with installed browsers. The playbook is executable in Claude on fallbacks. Owner ruling: manifest environment tags are Codex-side authoring metadata and are not corrected here."}
  exceptions:
    - {id: MTS-EXC-001, area: repository_layout, approved_by: Josh Coley, approved_at: "2026-09-06", statement: "The application is flattened to the repository root (app/, e2e/) rather than the src/app/ and tests/ paths planned in INTEGRATION-MANIFEST.md and IMPLEMENTATION-PLAN.md.", rationale: "Owner accepted the flattened layout established in commit 06f7a57; it does not change the approved architecture, server/client boundaries, or any security control.", impact: "Planned-path columns in mts/INTEGRATION-MANIFEST.md and the layout block in mts/IMPLEMENTATION-PLAN.md read src/-prefixed; implementation uses the root-relative equivalents (app/, lib/, e2e/). Traceability is otherwise unchanged.", status: approved}
    - {id: MTS-EXC-002, area: browser_verification, approved_by: Josh Coley, approved_at: "2026-09-06", statement: "WebKit browser verification runs in CI only and is not executed on the workstation.", rationale: "WebKit needs 121 system packages on this Ubuntu 26.04 host; owner declined local installation. Binaries are installed and the project is enabled by PLAYWRIGHT_WEBKIT=1.", impact: "Local browser evidence covers Chromium (4 viewport projects) and Firefox. WebKit evidence now exists: the first CI run on 2026-09-07 (run 34129317849) executed 61 webkit-desktop checks, all passing, closing the gap this exception created. The exception itself stands - WebKit still does not run on the workstation - so WebKit regressions surface in CI rather than locally.", status: approved}
  deviations:
    - {id: MTS-DEV-001, at: "2026-09-06", stage: S1, area: visual_reference, statement: "The landing hero evidence snapshot and the report-preview severity table and RLS matrix excerpt shown in MDS-REF-002 are not populated in S1.", rationale: "Both regions read from documented finding and evidence data that did not exist before S2-S4. Populating them then would have required inventing findings, which MPS-RULE-007 and the reference authority rule prohibit.", implemented_instead: "The hero rendered the approved Synthetic SaaS context panel (MDS-REF-005, MPS-REQ-002); the report preview rendered the approved report-route band (MDS-REF-005) with no fabricated finding.", resolution_slice: S4, status: resolved_awaiting_owner_confirmation, resolved_at: "2026-09-07", resolution: "S4 populates both regions from the derived report model on owner direction. The hero renders the evidence snapshot MDS-REF-002 shows - counts by documented state plus one recorded policy under both configurations, with the result the same documented test (RLS-005) produced against each. The landing band renders the severity-ranked finding table and the RLS matrix excerpt. Every value in both is read from the committed transcripts through lib/evidence/report.ts, the same module the report route uses, so the landing page cannot state a count the report does not. A browser check asserts the two agree. The Synthetic SaaS context panel keeps its canonical home on the scenario index (MDS-REF-005, MPS-ACC-002), so no MPS-REQ-002 coverage was lost."}
    - {id: MTS-DEV-002, at: "2026-09-06", stage: S1, area: route_completeness, statement: "/report, /inquiry, and /scenarios/[slug] exist from S1 and render a build-state notice instead of their approved content.", rationale: "MDS responsive.rules.visibility forbids hiding the report route or the primary CTA, and MPS-ACC-010 requires the report to be reachable without completing a scenario. Broken navigation targets were judged worse than an explicit, honest not-published state.", implemented_instead: "A shared notice composed from the approved alert, card, and status-indicator components. It states the canonical untested evidence state, says plainly that no documented test has been run, and offers recovery routes. It uses no evidence vocabulary that would imply a retrieved-but-unavailable result.", resolution_slice: "S2, S3, S4, S5", status: resolved, resolved_at: "2026-09-08", resolution: "All four routes now render their approved content. S2 published the first two scenario routes, S3 the remaining two, S4 the report, and S5 the inquiry form - the last route holding the notice. components/layout/pending-route.tsx is now unreferenced by any route; it is retained as the approved treatment should a future slice need it, and MTS-OBS-043 records that."}
  observations:
    - {id: MTS-OBS-001, at: "2026-09-06", stage: S1, area: visual_reference, statement: "MDS-REF-002 renders a five-step service process labelled Align / Run scenarios / Analyze / Report / Plan. S1 uses the approved written vocabulary Context -> Vulnerable proof -> Remediation -> Repeated test -> Limitation.", authority: "DESIGN-SYSTEM.md section 11 locks the stepper vocabulary; COMPOSITION-PROPOSAL defines the landing 'How the proof works' section with the same five steps; the Gate 5 reconciliation replaced exactly that unapproved stepper in the component library. Written MDS governs over the reference image."}
    - {id: MTS-OBS-002, at: "2026-09-06", stage: S1, area: open_mts_decision, statement: "MDS records icons.implementation as mts_to_select and the approved technology set names no icon package. S1 inlines the required glyphs as SVG rather than selecting an unapproved dependency.", correction: "Owner review on 2026-09-06 found the first S1 icon set did not match the approved references. Each glyph was re-cut against zoomed crops of MDS-REF-002, MDS-REF-003 and MDS-REF-005 using the Lucide outline geometry the references render, and two substantive mismatches were fixed: Reliability and recovery uses the clock on scenario cards (MDS-REF-005) and the gear on the landing pillar row (MDS-REF-002); evidence state moved from outline icons to the filled semantic badge with a knocked-out glyph that every canonical reference shows.", requires: "MTS decision to confirm the inline set or approve a package before the icon surface grows in S2-S4."}
    - {id: MTS-OBS-003, at: "2026-09-06", stage: S1, area: design_accessibility, statement: "The approved references render scenario and pillar icons in per-pillar hues (green, green, purple, orange in MDS-REF-005). The approved palette contains no purple or orange token, so S1 renders all pillar and scenario icons in brand.primary.", authority: "Hardcoding a colour with no approved token is prohibited by mds/specification/DO-DONT.md. Icon colour carries no state meaning here, so nothing is lost."}
    - {id: MTS-OBS-004, at: "2026-09-06", stage: S1, area: design_accessibility, statement: "The vulnerable and warning evidence states resolve to the same filled circle-with-exclamation shape in different semantic hues, so shape alone does not separate them.", mitigation: "Both states always render their exact canonical label and explanation adjacent to the badge, which the MDS requires, so meaning never rests on colour or shape alone.", requires: "MDS decision if a distinct warning symbol is wanted; recorded as MDS-GAP-S1-002."}
    - {id: MTS-OBS-005, at: "2026-09-06", stage: S2, area: evidence_provenance, statement: "The lab presents RECORDED evidence, not a live query. Real SQL runs against a real isolated PostgreSQL 17.6 fixture in the offline recorder; the transcript of that run is committed and the published application replays it. The application opens no database connection.", rationale: "This is what the MTS vulnerable-demonstration rule asks for - evidence from a bounded fixture or test harness, deterministic and resettable - and it is the only shape in which a public site can show a genuine cross-tenant failure without hosting one.", disclosure: "Stated in every evidence caption (recording time, engine, host, fixture digest) and in the scenario limitation, so no buyer can mistake a replay for a live run.", status: resolved, decided_at: "2026-09-06", decided_by: Josh Coley, decision: "Confirmed. Recorded-and-disclosed is the intended R1 posture for the public lab, and no live scanning of any kind is added. A buyer who wants a live audit is directed to the inquiry path and handled as a paid engagement outside the public product, which is what the authorized-review CTA already exists to do. Live capability is deferred to R2/R3 as a product decision, not a technical blocker.", follow_through: "Owner approved two additions with the confirmation, both implemented under MTS-CHG-005: a transcript freshness gate that runs wherever checks run, and a buyer-visible reproducibility statement beside the existing provenance caption. See MTS-DEC-008 and MTS-OBS-016."}
    - {id: MTS-OBS-006, at: "2026-09-06", stage: S2, area: visual_reference, statement: "MDS-REF-003 and MDS-REF-006 render the code/log excerpt tabs as Test output | SQL | Request | Response. S2 renders Test output | SQL | Verification | Response.", authority: "The reference is authoritative for what it clearly shows, and its illustrative labels are not product data. A documented test here is a SQL statement executed against the fixture as a database role; there is no HTTP request to show, so a Request tab could only be filled by inventing one. Verification replaces it and carries something real: the read-back of stored rows after a write, which is what proves whether a cross-tenant write actually persisted.", status: confirmed, confirmed_at: "2026-09-06", confirmed_by: Josh Coley, owner_note: "Owner agreed and left the Request tab to implementation judgement (\"if you need one\"). No Request tab was added: a documented test is SQL executed as a database role and carries no HTTP request, so the tab could only be populated by inventing one, which MPS-RULE-007 prohibits. The other three labels already match the references."}
    - {id: MTS-OBS-007, at: "2026-09-06", stage: S2, area: evidence_vocabulary, statement: "The MDS-REF-006 matrix legend reads Covered / Not tested / Partial / Not applicable. S2 uses the canonical DESIGN-SYSTEM section 9 vocabulary instead: Remediated - documented test blocked / Vulnerable - test succeeded unexpectedly / Untested / Not applicable.", authority: "COMPONENTS-PROPOSAL requires matrix cells to use the canonical evidence-state component, and section 9 forbids paraphrasing those labels. Covered and Partial are not approved states, and Covered in particular reads as an unqualified pass, which MPS-RULE-002 and MPS-ACC-005 prohibit.", status: confirmed, confirmed_at: "2026-09-06", confirmed_by: Josh Coley}
    - {id: MTS-OBS-008, at: "2026-09-06", stage: S2, area: data_architecture, statement: "The canonical references show fixture tables as public.profiles, org_members, invoices and storage.objects. S2 creates them in a dedicated `synthetic` schema as synthetic.profiles, synthetic.org_members, synthetic.invoices and synthetic.storage_objects.", authority: "Reference table names are illustrative. The isolation requirement is not: the fixture must stay provably separate from the inquiry store S5 adds to public. A dedicated schema makes that boundary checkable rather than conventional - synthetic.reset_fixture() names its five tables literally, uses no dynamic SQL, and a test proves a row in public survives a reset. synthetic.storage_objects is a metadata-only stand-in for storage.objects and stores no file content.", status: confirmed, confirmed_at: "2026-09-06", confirmed_by: Josh Coley}
    - {id: MTS-OBS-009, at: "2026-09-06", stage: S2, area: engineering_finding, statement: "Two PostgreSQL behaviours were established by running the fixture, and both change what a correct RLS review must check. (1) Omitting WITH CHECK on an UPDATE policy is not a vulnerability: PostgreSQL reuses the USING expression as the check. (2) A widened WITH CHECK is still not sufficient to escalate on its own: when a SELECT policy exists, PostgreSQL also tests the new row against it for any UPDATE that reads, so a tenant-scoped read policy blocks the write even when the check says true.", impact: "The first draft of the vulnerable fixture reproduced neither. Both were corrected against actual recorded output rather than assumption, and the second is now surfaced to the buyer as remediation guidance.", note: "Recorded because it is the kind of finding the service exists to produce, and because it shows the evidence was not written to a predetermined answer.", status: acknowledged, acknowledged_at: "2026-09-07", acknowledged_by: Josh Coley, closure_note: "Retained as a durable engineering finding, not closed away: both PostgreSQL behaviours change what a correct RLS review must check, and the second is surfaced to buyers as remediation guidance. Carry into S3 and S4 review checklists."}
    - {id: MTS-OBS-010, at: "2026-09-06", stage: S2, area: component_extension, statement: "components/ui/button.tsx gained an opt-in `disableWhileLoading` prop, default true so S1 behaviour is unchanged.", rationale: "Disabling the control the buyer just activated makes the browser drop focus to the body, which breaks the approved interaction rule that focus moves only after deliberate navigation, submission, or recovery. The three guided-lab run controls opt out, stay focusable, and are marked aria-disabled and aria-busy while the replay is in flight; re-entry is guarded in the handler. Caught by a Playwright focus assertion, not by inspection.", status: acknowledged, acknowledged_at: "2026-09-07", acknowledged_by: Josh Coley, closure_note: "The disableWhileLoading extension stands. Any future control that runs work on activation must opt out the same way, or it will drop focus to the body and break the approved interaction rule."}
    - {id: MTS-OBS-011, at: "2026-09-06", stage: S2, area: security_boundary, statement: "The fixture simplifies IDENTITY, not authorization. A real Supabase policy calls auth.uid(), which reads a signed JWT the caller cannot forge; the fixture has no auth service and carries the acting member in a transaction-local GUC that any session holding a database connection could set.", assessment: "Not exploitable as built. The policies under test are ordinary PostgreSQL row level security and behave exactly as they would against auth.uid(); only the identity source differs. Nothing but the offline recorder ever connects - the database runs in a local container and the deployed application holds no database client - so no caller can assert an identity.", constraint: "This fixture must never be exposed to a public network or reused as an application backend. Recorded in the migration alongside the function so the constraint travels with the code.", status: acknowledged, acknowledged_at: "2026-09-07", acknowledged_by: Josh Coley, constraint_status: binding, closure_note: "Acknowledged, but the constraint does NOT close with the observation. The fixture must never be exposed to a public network or reused as an application backend, because identity is a transaction-local GUC rather than a signed JWT. This is the technical floor under MTS-DEC-008 and is the first thing to revisit if R2/R3 reconsiders live capability. S5 must keep its Supabase client on a path separate from the evidence engine (see MTS-RISK-001 residual)."}
    - {id: MTS-OBS-012, at: "2026-09-06", stage: S2, area: security_review, statement: "A security review of the S2 diff produced no finding at reportable confidence.", scope: "Checked: injection reachability into the dynamic-SQL harness, the Server Action input boundary, SECURITY DEFINER search_path handling and grants, XSS sinks in the new components, client-bundle leakage, and credential exposure in source, build output, logs, and the recorded transcript.", hardened_anyway: "Two items were tightened without being findings: the recorder now passes the mode and case identifier as psql variables instead of interpolating them into SQL strings, and the fixture identity boundary is documented at the function that defines it (MTS-OBS-011).", status: acknowledged, acknowledged_at: "2026-09-07", acknowledged_by: Josh Coley, closure_note: "A clean review of the S2 diff at a point in time. It is not a standing assurance and does not cover S3 onward; the webhook handler and the S5 inquiry path each need their own review."}
    - {id: MTS-OBS-013, at: "2026-09-06", stage: S2, area: responsive_layout, statement: "Three real responsive defects were found by measuring page scroll rather than by inspection, and all three are fixed.", detail: "(1) Tailwind's sr-only is position:absolute; with no positioned ancestor those spans resolve against the initial containing block, so the matrix cells' screen-reader state text landed far right of a horizontally scrolled table and made the whole PAGE scroll sideways by up to 206px. Fixed by establishing a containing block on the matrix scroller and the code-excerpt panel. (2) Flex and grid items default to min-width:auto, letting a wide code line or table widen its ancestors instead of scrolling inside its own container; min-w-0 was added along the chain from main downwards. (3) At 320px the run controls exceeded the content column because the shared button sets whitespace-nowrap; the three lab controls now wrap instead, with no label shortened.", verified: "No horizontal page scroll on either published scenario, in both the untested and the fully run state, at 320, 360, 390, 640, 768, 960, 1280 and 1440px.", status: acknowledged, acknowledged_at: "2026-09-07", acknowledged_by: Josh Coley, closure_note: "The three defects are fixed and covered by measured assertions at eight widths. The underlying lesson stands for later slices: sr-only text needs a positioned ancestor, and flex/grid children need min-w-0 along the chain."}
    - {id: MTS-OBS-014, at: "2026-09-06", stage: S2, area: verification_integrity, statement: "An earlier S2 verification run reported 236 passed against a STALE server build, because a kill in the restart chain failed silently and the new server could not take the port. Those numbers were discarded.", correction: "The suite was re-run against a from-clean rebuild with the running build confirmed first. On that build 13 real failures appeared - the horizontal-overflow defects in MTS-OBS-013 and a contrast-measurement gap - none of which the stale run could see.", lesson: "A green suite is only evidence if the build under test is confirmed to be the build being reported. Recorded so the S3 checkpoint does not repeat it.", status: acknowledged, acknowledged_at: "2026-09-07", acknowledged_by: Josh Coley, closure_note: "Kept prominent deliberately. The trap recurred during the S2 checkpoint work - a stale server from an earlier session answered on a port the new one had failed to bind - and was caught only because this observation prompted verifying the served build. See also MTS-OBS-018."}
    - {id: MTS-OBS-015, at: "2026-09-06", stage: S2, area: accessibility_tooling, statement: "The measured contrast helper now skips nodes clipped to a 1px box (the sr-only pattern).", rationale: "Such text reported 1.00:1 against whatever sat behind it while being unreadable by definition. WCAG 1.4.3 governs perceivable text, and measuring screen-reader-only strings would have reported 19 failures no sighted user can encounter - and would have pushed toward deleting the very text that carries evidence state non-visually. The helper was extracted to e2e/contrast.ts so S1 and S2 share one implementation.", status: acknowledged, acknowledged_at: "2026-09-07", acknowledged_by: Josh Coley, closure_note: "The helper is shared at e2e/contrast.ts and must stay that way; measuring screen-reader-only text would report failures no sighted user can encounter and would pressure removal of the text carrying evidence state non-visually."}
    - {id: MTS-OBS-016, at: "2026-09-06", stage: S2, area: verification_integrity, statement: "The owner-approved wiring of evidence verification into the release gate is delivered in two parts, because the two halves have different infrastructure needs.", delivered_now: "The database-free half. Transcript freshness, schema, mode completeness, and credential-shape checks run as `pnpm evidence:check`, inside the new aggregate `pnpm check`, and as a unit test, so staleness fails an ordinary check run on any checkout.", deferred_to_s6: "The database-backed half. `pnpm evidence:verify` re-records twice from a clean database and needs PostgreSQL and the Supabase CLI as CI services. No CI workflow exists in the repository yet - `.github/` is absent - and creating a partial one now would pre-empt the S6 workflow that also has to carry the WebKit project deferred under MTS-EXC-002. It is recorded here and in the roadmap as a binding S6 requirement rather than wired early.", resolution: "Resolved on owner instruction the same day, ahead of S6. .github/workflows/verify.yml now runs three jobs: checks (pnpm check, including the freshness gate), evidence (Supabase CLI 2.111.0 pinned to the recorded engine, then pnpm evidence:verify), and browsers (the full matrix with PLAYWRIGHT_WEBKIT=1 and --with-deps). The CI provider selection this required is recorded as MTS-DEC-009.", residual: none, first_execution: "Run 34129317849 on PR #3, 2026-09-07: all three jobs green on the first attempt. The evidence job reproduced the committed transcript from a clean database on a fresh runner, which proves the determinism claim on hardware that has never seen this fixture - a stronger result than the workstation reruns.", status: resolved}
    - {id: MTS-OBS-017, at: "2026-09-06", stage: S2, area: evidence_vocabulary, statement: "MDS-GAP-S1-002 no longer describes the shipped code, and the real collision is a different pair. The gap says vulnerable and warning share the filled circle. After the S1 icon re-cut (commit 5044e75) components/ui/status-indicator.tsx renders vulnerable as exclamation-circle in the danger hue and warning as exclamation-triangle in the warning hue, so those two are already distinct in both shape and colour.", actual_collision: "warning (Review required) and unavailable (Evidence unavailable) are now rendered identically - both exclamation-triangle, both text-warning, both bg-warning/8 - and are separated only by their label text.", spec_relationship: "The implementation also inverts the written component spec. mds/COMPONENTS-PROPOSAL.md assigns vulnerable alert-triangle, warning alert-circle, and unavailable cloud-off or alert-circle; the code has vulnerable circle and warning triangle. The inversion follows the filled badge the canonical references render, which the owner confirmed at the S1 review, but the glyph SHAPES in that written table were never applied.", recommendation: "Adopt the COMPONENTS-PROPOSAL shapes inside the approved filled-badge treatment: vulnerable filled triangle, warning filled circle, unavailable cloud-off. That yields four distinct evidence shapes, resolves the warning/unavailable collision, keeps the badge treatment the owner approved, and requires no new MDS decision because the written spec already states the assignment.", requires: "MDS confirmation. This is a design decision and was not changed unilaterally.", supersedes_statement_in: "MDS-GAP-S1-002"}
    - {id: MTS-OBS-019, at: "2026-09-07", stage: S2, area: verification_integrity, statement: "The CI gate produced browser evidence the workstation cannot, and produced it more cleanly.", detail: "Run 34129317849 executed 366 checks at one worker: 364 passed, 2 flaky that passed on retry, 0 failed. 61 of those were webkit-desktop, the first WebKit evidence this project has ever had (MTS-EXC-002). The two flaky checks were chromium-wide scenario-card columns and chromium-tablet keyboard traversal; both passed on retry #1 in about 1.2-1.5s, consistent with runner warm-up rather than a defect, and both are stable across every workstation run.", significance: "The evidence job reproducing the committed transcript from a clean database on a fresh runner is a stronger determinism result than any workstation rerun: the hardware had never seen this fixture. It also means MTS-RISK-006 is now controlled by a gate that runs without anyone remembering to run it.", watch: "The two flaky checks are recorded so a rising flake rate is visible rather than absorbed by the retry budget."}
    - {id: MTS-OBS-018, at: "2026-09-06", stage: S2, area: verification_integrity, statement: "The horizontal-overflow test was structurally under-budgeted and failed as a timeout in the five-project run, not as an overflow.", detail: "It drives seven widths across every public route - over forty navigations in one test, each waiting on document.fonts.ready. Measured in isolation it takes 29-44s against the default 60s budget; at four workers it exceeded 60s and reported a page.evaluate timeout, so no overflow assertion was ever reached and the failure carried no information about layout. Re-run alone it passed three times out of three with no code change.", resolution: "test.slow() on that test triples its budget. The width matrix was deliberately not thinned - the widths are what the test exists to check - and the assertion is unchanged.", note: "Recorded because a timeout that looks like a layout failure is exactly the kind of result that gets mistaken for a real defect, or worse, silenced by weakening the assertion."}
    - {id: MTS-OBS-028, at: "2026-09-07", stage: S4, area: visual_reference, statement: "MDS-REF-007 composes the report in three columns: a section index, the report, and a persistent rail carrying Methodology, Scope and limitations, and the CTA. The written COMPOSITION-PROPOSAL says \"Desktop uses a sticky section index beside the report\" and lists methodology (6) and method/limitations (7) as report SECTIONS.", authority: "Written MDS state outranks a canonical reference (design authority order, items 2-5 above item 6). The written shell is decisive: one index beside one report column, with methodology and limitations as sections in the approved eight-section order.", decision: "Owner chose the two-column written-MDS composition at the S4 pre-implementation checkpoint on 2026-09-07.", implemented: "Sticky 224px section index beside one report column, becoming an in-flow table of contents below 960px. Prose is held to the approved 760px reading measure while matrices, tables, and evidence take the full width of the shell - which is the approved rule \"Reading/report prose 760px, a single readable column nested within the wider report shell\".", status: approved, approved_by: Josh Coley, approved_at: "2026-09-07", approval_note: "Approved as part of the owner's ruling on the six S4 checkpoint observations, 2026-09-07. Each records a decision already taken or an implementation already shipped and verified; none required further work."}
    - {id: MTS-OBS-029, at: "2026-09-07", stage: S4, area: visual_reference, statement: "MDS-REF-007 renders the findings list with a severity filter (All / High / Medium / Info / Untested) and a Collapse all control. Neither is implemented.", authority: "The approved report shell must \"remain readable/printable without interaction\". A control that hides findings works against that, and every one of the four documented findings is High severity, so three of the four filter options could only ever render an empty state.", decision: "Owner chose the static, fully expanded findings list at the S4 pre-implementation checkpoint on 2026-09-07.", implemented: "Every finding renders expanded, with no filter and no collapse. The report route is a static server component and needs no JavaScript to be read. Depth that would bury the report - every check in an area, every delivery in a sequence - stays in the scenario, which each finding links to. Two browser checks assert that no such control exists.", note: "The reference severity vocabulary also includes Info, which the implemented catalogs do not carry: their severity levels are High, Medium and Low. No finding was re-rated to populate a column.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-07", approval_note: "Approved as part of the owner's ruling on the six S4 checkpoint observations, 2026-09-07. Each records a decision already taken or an implementation already shipped and verified; none required further work."}
    - {id: MTS-OBS-030, at: "2026-09-07", stage: S4, area: evidence_integrity, statement: "Every number the report publishes is derived, and the derivation is separated from the authored narrative by module rather than by convention. lib/evidence/report.ts reads counts, states, before/after status, matrix cells, and reproduction excerpts from the two committed transcripts; lib/content/report.ts holds framing only and contains no result, count, severity, state, or date.", rationale: "A report is the surface where an invented number would do the most damage. Splitting the layers means the report has no way to produce one - if a fact is not in a catalog or a transcript, it cannot appear.", verification: "12 unit tests recompute every published total directly from the transcript JSON by different code than the model uses, so the model cannot confirm its own arithmetic. Two more assert that neither the authored narrative nor the derived strings contain prohibited vocabulary; that check caught one real instance in the authored case study during implementation, which was rewritten rather than exempted.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-07", approval_note: "Approved as part of the owner's ruling on the six S4 checkpoint observations, 2026-09-07. Each records a decision already taken or an implementation already shipped and verified; none required further work."}
    - {id: MTS-OBS-031, at: "2026-09-07", stage: S4, area: evidence_ordering, statement: "All four documented findings are High severity, so severity alone cannot order them. MDS requires findings \"ordered by launch risk and dependency - not merely color\".", implemented: "The ranking rule is computed and published on the page: severity first; then the number of documented checks that did not meet their expectation as found (6, 6, 3, 3); then the approved scenario order, which is also the dependency order because tenant isolation is the boundary the later scenarios assume. Every input is a recorded count or an approved ordinal, and none is a judgement made at render time. Two unit tests assert no finding outranks one with higher severity or more unmet checks.", note: "The resulting order happens to match the approved scenario order. That is an outcome of the rule, not the rule itself.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-07", approval_note: "Approved as part of the owner's ruling on the six S4 checkpoint observations, 2026-09-07. Each records a decision already taken or an implementation already shipped and verified; none required further work."}
    - {id: MTS-OBS-032, at: "2026-09-07", stage: S4, area: responsive_defect, statement: "Two real horizontal-overflow defects were found on /report at 320px and fixed, both invisible at every other width. (1) The report section element is a flex item, and a flex item's default min-width:auto let it grow to the width of the code excerpt's pre-formatted evidence lines, bypassing the excerpt's own scroller and scrolling the whole page sideways. (2) The scenario link label carried the area name, and the approved button sets whitespace-nowrap, so \"Open the Storage & configuration lab\" was wider than the viewport.", impact: "The first is the same min-width:auto trap the coverage matrix and delivery ledger already carry comments about; it recurs wherever a new flex ancestor is introduced above an evidence surface. The second is a reminder that the approved button cannot wrap, so any label under it must be short.", resolution: "min-w-0 on the report section, documented at the site. The link keeps a short visible label with the area name in an sr-only span, so the four links stay distinguishable in a list of links and the visible text is a prefix of the accessible name, which is what WCAG 2.2 AA 2.5.3 Label in Name requires.", note: "Found by the existing S1 responsive check, not by inspection - and initially mis-measured against a stale server that was still holding port 3000 while a rebuilt one failed to start. That is MTS-OBS-014 recurring in a manual probe; the browser suite already refuses to reuse an existing server for exactly this reason (MTS-DEC-011).", status: approved, approved_by: Josh Coley, approved_at: "2026-09-07", approval_note: "Approved as part of the owner's ruling on the six S4 checkpoint observations, 2026-09-07. Each records a decision already taken or an implementation already shipped and verified; none required further work."}
    - {id: MTS-OBS-034, at: "2026-09-08", stage: S5, area: reference_conflict, statement: "MPS-REQ-010 requires an inquiry to contain role and authorization status. MDS-REF-008, the canonical inquiry reference, shows neither - it shows name, work email, company, current stage, areas of concern, and a free-text request.", resolution: "Both fields were added beside the reference's six. An approved MPS requirement is the first authority in the MDS visual order, ahead of a canonical reference, and the REFERENCE-RECONCILIATION entry for MDS-REF-008 already permits field wording to be refined without changing collected information or the safety boundary - adding a field the MPS mandates is inside that. The authorization confirmation uses the checkbox variant the approved component table already names ('Checkbox - default, authorization confirmation'), so no new visual convention was invented.", why_not_an_mds_gap: "Nothing undecided was decided here. The MDS names the control, the MPS names the field, and the reference note permits the refinement.", status: confirmed, confirmed_by: Josh Coley, confirmed_at: "2026-09-08"}
    - {id: MTS-OBS-035, at: "2026-09-08", stage: S5, area: data_isolation, statement: "The inquiry schema is a SEPARATE migration set (supabase/inquiry/migrations) applied to a SEPARATE database, not part of supabase/migrations.", rationale: "SECURITY-ARCHITECTURE requires production inquiry data to be kept separate from synthetic fixtures and reset commands. Three consequences follow deliberately: the evidence recorder's input digest does not cover the inquiry schema, so an inquiry migration cannot invalidate published evidence; the fixture reset cannot see an inquiry table, which the S2 safety checks already prove for anything outside the synthetic schema; and the operator scripts refuse to run against the fixture database by name.", status: confirmed, confirmed_by: Josh Coley, confirmed_at: "2026-09-08"}
    - {id: MTS-OBS-036, at: "2026-09-08", stage: S5, area: authorization_model, statement: "Neither inquiry table is exposed to an application role at all. RLS is enabled with no policy AND every privilege is revoked, which is two independent denials, and the entire reachable surface is two SECURITY DEFINER functions with a fixed empty search_path.", consequence: "No service-role key is needed or read anywhere in the repository. INTEGRATION-MANIFEST admits one 'only if a later approved server operation requires it'; none does. There is also no read path to an inquiry from the public key - not a filtered one and not an aggregate one - so a compromised publishable key can submit an inquiry and learn nothing.", status: confirmed, confirmed_by: Josh Coley, confirmed_at: "2026-09-08"}
    - {id: MTS-OBS-037, at: "2026-09-08", stage: S5, area: abuse_control, statement: "Abuse control is two bounded counters evaluated inside the write path before any row is written: at most 20 new inquiries per minute across all senders, and at most 10 submissions per sender per day. It is deliberately NOT address-based.", rationale: "An IP address is personal data this product has no approved reason to store, and MPS-RULE-008 holds retained metadata to the minimum. The counters cost one index scan each and write nothing when they trip.", limitation: "This bounds volume reaching the store; it does not bound requests reaching the route.", status: confirmed, confirmed_by: Josh Coley, confirmed_at: "2026-09-08", ruling: "Confirmed as the R1 control. Request-level flooding is handled at the platform edge in S6; no IP address is stored, so MPS-RULE-008 holds retained metadata to a genuine minimum. Adding address-based limiting would be an MPS/MTS scope decision, not an implementation choice.", carried_to: S6}
    - {id: MTS-OBS-038, at: "2026-09-08", stage: S5, area: product_behaviour, statement: "A duplicate submission creates no second record. As first built it also sent no second operator notification, which meant an operator watching only their inbox could not see that a buyer had followed up.", status: decided_and_implemented, decided_by: Josh Coley, decided_at: "2026-09-08", ruling: "Send a distinct follow-up alert. One record, one engagement, and an operator message that cannot be read as a second inquiry.", implemented: "lib/inquiry/notify.ts buildFollowUpNotification and notifyOperatorOfFollowUp. The subject reads 'Repeat submission #N - <name> (not a new inquiry)'; the body states the repeat number, names the original and its date, and says outright that no second record was created and no second engagement exists. It deliberately does not repeat the buyer's original message, because a re-sent message is how one inquiry starts to look like two in an inbox. Its result is discarded: the buyer's outcome is settled by the record that already exists, so a failed follow-up alert cannot change what they are told.", rule_preserved: "MPS-RULE-006 is unaffected. The record count and the engagement count both stay at one; only the operator's visibility changed."}
    - {id: MTS-OBS-039, at: "2026-09-08", stage: S5, area: operations, statement: "Retention is a SQL function invoked by `pnpm inquiries:retain`. As first built, nothing scheduled it.", authority: "Owner decision 2026-09-08 (MTS-DEC-013) chose an operator command over pg_cron, then 2026-09-08 (MTS-DEC-015) chose GitHub Actions to invoke it.", status: resolved, resolved_at: "2026-09-08", resolution: ".github/workflows/retention.yml runs the command monthly (04:00 UTC on the first) and on demand. It is the only workflow in the repository that touches real data, so it runs on schedule and dispatch only - never on a push or a pull request - no-ops with a clear notice when INQUIRY_DATABASE_URL is absent, and prints counts rather than content. It runs --dry-run first so the log records what was due before it records what was done.", verification: "INQUIRY_DATABASE_URL is configured against the isolated inquiry database, the workflow reached the default branch with the PR #8 merge, and the first dispatch was observed on 2026-09-08 (run 34277980502): the dry run reported `0 inquiry record(s) are past 12 months of inactivity` and the real pass `0 inquiry record(s) redacted (was 0 due)`. The log printed counts only - no inquiry content, no address, no connection string. MPS-REQ-015 is now satisfied by an unattended process rather than by an available command."}
    - {id: MTS-OBS-040, at: "2026-09-08", stage: S5, area: dependency, statement: "One dependency was added: `server-only` (0.0.1), the Next.js-documented guard that makes importing a server module from a Client Component a build error.", rationale: "Next.js handles the specifier internally and the package's contents are unused at build time, so installing it is optional for the build - but the Node-based unit runner cannot resolve the bare specifier without it. `pnpm test:unit` now runs under --conditions=react-server so the guard resolves the way the server bundler resolves it.", scope_note: "This is a framework guard, not a technology selection: it adds no provider, no service, and no runtime behaviour.", status: confirmed, confirmed_by: Josh Coley, confirmed_at: "2026-09-08"}
    - {id: MTS-OBS-041, at: "2026-09-08", stage: S5, area: defect_found_and_fixed, statement: "The retention clock was originally written with now(), which PostgreSQL fixes for the whole transaction. A repeat submission therefore did not advance 'latest activity', which is the exact quantity MPS-REQ-015 measures 12 months from.", found_by: "The duplicate check in supabase/inquiry/tests/inquiry-checks.sql, on its first run against a real database.", fix: "last_activity_at is set from clock_timestamp() in the column default and in both functions that touch it.", note: "The defect was invisible in production shape, where each submission is its own transaction. It would have surfaced as records ageing out from first contact rather than from last.", status: confirmed, confirmed_by: Josh Coley, confirmed_at: "2026-09-08"}
    - {id: MTS-OBS-042, at: "2026-09-08", stage: S5, area: delivery_verification, statement: "The Resend notification boundary had never sent a real message. Its success, provider-rejection, transport-failure, and unconfigured paths were covered only by unit tests against an injected transport.", status: resolved, resolved_at: "2026-09-08", authority: "Owner instruction 2026-09-08 to test the notification path, lifting the MTS-DEC-014 gate for a single send.", resolution: "One real message was sent through the shipped path - notifyOperator through resendTransport - to the configured INQUIRY_NOTIFICATION_TO and nowhere else. Resend accepted it. The harness is tests/unit/inquiry-live-delivery.spec.ts, which is SKIPPED unless INQUIRY_LIVE_DELIVERY=1, so it cannot fire from pnpm check or from CI.", precision: "A sent result means the provider ACCEPTED the message, not that it reached an inbox. Inbox arrival was reported by the owner and is not observable from the repository.", end_to_end: "On 2026-09-08 a real submission through the running application to the isolated hosted project returned acknowledged with delivered:true - the record was written and the operator notification was accepted in one pass. The sender is currently onboarding@resend.dev, the Resend sandbox address, which can only deliver to the account owner and is therefore preview-safe by construction.", remaining: "A verified from-domain for production, and delivery from a deployed preview environment using the preview-safe destination configured in THAT environment, are both still unproven and belong to S6."}
    - {id: MTS-OBS-048, at: "2026-09-09", stage: S6, area: deployment_security, severity: medium, statement: "The deployed application sends no response security headers beyond HSTS. There is no Content-Security-Policy, X-Frame-Options or frame-ancestors, X-Content-Type-Options, Referrer-Policy, or Permissions-Policy.", evidence: "Response headers requested from https://supabase-saas-launch-readiness-lab.vercel.app/ on 2026-09-09 carried only `strict-transport-security: max-age=63072000; includeSubDomains; preload`, which is Vercel's own default rather than anything this repository sets. next.config.ts declares no headers() and carries no configuration at all.", analysis: "This is a gap rather than a deviation. SECURITY-ARCHITECTURE.md Controls covers input validation, abuse control, RLS and grants, secret handling, data separation, retention, preview-safe destinations, and dependency management - it says nothing about response headers, so nothing approved has been departed from. But the artifact that would have decided it is the one that is silent, and R1 is a public site whose whole subject is launch readiness. A clickjacking or content-type-sniffing control absent from a launch-readiness demonstration is worth an explicit decision either way.", not_done: "No header was added. Choosing a security-header posture is an MTS architecture decision, and inventing a CSP for a site whose evidence surfaces include inline code excerpts could break rendering in ways no current test would catch.", status: open, awaiting: "Owner decision on whether R1 sets response security headers, and if so which."}
    - {id: MTS-OBS-049, at: "2026-09-09", stage: S6, area: release_readiness, severity: medium, statement: "It is not established that the deployed application can accept a real inquiry. The production environment values are still recorded as outstanding S6 work, and if they are absent the inquiry path answers a real visitor with the unconfirmed state rather than an acknowledgement.", evidence: "The route boundary itself is correct on the deployment: GET /api/inquiries answers 405, and an empty POST answers the approved invalid state with per-field messages and no leakage. Both of those complete before any store is reached, so neither says anything about whether the store is configured.", not_done: "Deliberately not tested. The only way to exercise the path past validation is a valid submission, which - if the environment IS configured - writes a real row to the isolated inquiry project and sends a real operator notification. That is an owner-gated production action under the playbook, not an agent verification step.", status: open, awaiting: "Owner instruction on how to verify the production inquiry path, and confirmation of which environment values are set on Vercel. Related: the preview-safe Resend destination and production from-domain of MTS-OBS-042, which are the same release item."}
    - {id: MTS-OBS-050, at: "2026-09-09", stage: S6, area: data_separation, severity: medium, statement: "MTS-DEC-016 settles that measurement events stay first-party and land in Supabase. It does not settle WHICH database and schema hold them, and that is a data-separation question rather than an implementation detail.", detail: "The only hosted Supabase project this repository owns is the isolated inquiry project (ref vorxftvgvycrgduenark), which exists precisely because inquiry data is kept apart from everything else. Putting measurement rows in it places analytics beside inquiry PII in one database; standing up a second project keeps them apart at the cost of another environment to provision, hold credentials for, and verify. A third option is a separate schema inside the existing project with its own grants and no shared identifier or foreign key to inquiries.", recommendation: "A separate `measurement` schema inside the existing inquiry project: no foreign key to inquiries, no shared identifier, its own grants, and its own deny-path assertions re-run against the hosted project under the rule MTS-OBS-044 established. It keeps one environment to operate while making the separation explicit and testable. Recorded as a recommendation, not applied.", status: decided, decided_at: "2026-09-09", decision: "The recommendation was taken. Measurement events live in a separate `measurement` schema inside the existing isolated inquiry project: no foreign key to inquiries, no shared identifier, its own grants, and its deny paths re-run against the hosted project under the rule MTS-OBS-044 established.", authority: "Owner decision 2026-09-09.", binding: "The separation is the point of the placement, so it is a property to be tested rather than a convention to be observed. No measurement row may carry an identifier that appears in an inquiry row, and the deny assertions must run in the hosted project as well as locally - a privilege assertion proves nothing about an environment it has not run in."}
    - {id: MTS-OBS-047, at: "2026-09-09", stage: S6, area: verification_integrity, severity: high, statement: "The CI verification gate cannot complete on main. Both the browsers job and the evidence job fail during apt-get update, before any project code runs, because a third-party apt source baked into the GitHub runner image - Google's chrome-stable repository - is serving a Packages.gz whose hash does not match the one its own Release file declares.", evidence: "Run 34384858936 on merge commit 2c848b2 failed in 46 seconds: browsers at the Install browsers step and evidence at the Install psql client step, both with `E: Failed to fetch https://dl.google.com/linux/chrome-stable/deb/.../Packages.gz Hash Sum mismatch` and exit code 100. A re-run of the failed jobs seven minutes later failed identically, so it is not a one-off. The checks job, which runs no apt command, passed both times. The same tree had passed all three jobs on pull request 10 thirty minutes earlier (run 34381440773: 738 browser checks passed, 0 failed, 0 flaky).", analysis: "Neither job needs that repository. The evidence job installs postgresql-client from the Ubuntu archive; the browsers job installs Playwright system dependencies. Google's chrome repository is present only because the runner image ships it, and apt-get update fails the whole command when any configured source fails its integrity check. The gate therefore has an undeclared dependency on a vendor unrelated to anything this project uses.", impact: "MTS-CAP-011 cannot be certified as a release gate while the gate cannot run, and MTS-RISK-006 - a stale transcript must fail a gate rather than depend on a person remembering - is not enforceable meanwhile. This blocks the S6 release, not the S6 QA pass.", candidate_fix: "Drop the unrelated third-party source before apt runs in both jobs, so the gate depends only on the Ubuntu archive it actually installs from. Not applied: it changes the approved CI gate and is an owner decision. The alternative is to wait for Google to republish a consistent index, which leaves the same failure able to recur during the release itself.", status: resolved, resolved_at: "2026-09-09", resolution: "Both halves happened, and the order matters for what can be claimed. The upstream index recovered on its own: a third re-run of the same failed jobs went green on all three without any change from this repository, so main was un-blocked by Google republishing a consistent index and NOT by anything done here. Separately, and on owner approval the same day, both apt-using jobs now delete the unrelated third-party sources the runner image ships before apt runs, so the gate depends only on the Ubuntu archive it installs from. That change is prevention against recurrence; it is not what fixed this occurrence and is not evidence that it would have.", verification: "Run 34384858936 re-run on merge commit 2c848b2: checks, evidence, and browsers all succeeded. The hardening is verified separately on slice/s6-combined-qa-release.", authority: "Owner approval 2026-09-09 to harden the workflow."}
    - {id: MTS-OBS-046, at: "2026-09-08", stage: S5, area: repository_hygiene, statement: "GitHub push protection blocked the S5 branch. The credential-guard test embedded Stripe's documentation example key as a literal, and a secret scanner cannot tell a published example from a live key by looking.", disposition: "The literal was removed rather than allowlisted. Every example value in that test - Stripe's docs key, the jwt.io sample, AWS's example access key id - is now assembled from fragments at runtime, so nothing on disk matches a scanner pattern while the string handed to the validator is byte for byte what a real credential would be. The assertions are unchanged.", rationale: "The unblock URL was available and was not used. A repository whose subject is launch-readiness cannot teach its owner to click through a push-protection warning; the reflex that gesture builds is the one this product exists to argue against.", side_effect: "The literal was already in two commits, and rewriting branch history was not available, so the branch was rebuilt as a single commit from main carrying the identical final tree. The branch is now slice/s5-inquiry (PR #8); slice/s5-inquiry-path remains locally and was never pushed. The tree was verified identical to the original branch tip before the new commit was made.", convention_established: "No credential-shaped literal enters this repository, not even a published example. Assemble it at runtime.", status: confirmed, confirmed_by: Josh Coley, confirmed_at: "2026-09-08"}
    - {id: MTS-OBS-045, at: "2026-09-08", stage: S5, area: defect_found_and_fixed, severity: medium, statement: "The operator scripts' fixture-database guard refused ANY connection string whose path was /postgres. A hosted Supabase project's database is also named `postgres`, so the guard would have refused the real inquiry database and `pnpm inquiries:retain` would have failed on every scheduled run with a message blaming the synthetic fixture.", cause: "The guard matched on database NAME alone. The local fixture container and a hosted Supabase project both use the name `postgres`; what distinguishes them is the host, not the database name.", found_by: "Hardening the same function against a mis-pasted secret value, before the owner had added INQUIRY_DATABASE_URL. It had never fired because no operator script had yet been pointed at the hosted project.", fix: "The guard now refuses only a LOCAL /postgres path (hostname 127.0.0.1 or localhost), which is the fixture container it was written to protect. It also parses the URL explicitly and reports a mis-pasted value as a mis-paste rather than letting psql report something unhelpful, and INQUIRY_DATABASE_URL is trimmed so a trailing newline from a paste cannot break a scheduled job that touches real data.", would_have_surfaced_as: "A monthly workflow failure with a misleading message, and MPS-REQ-015 quietly unsatisfied while appearing to be automated.", status: confirmed, confirmed_by: Josh Coley, confirmed_at: "2026-09-08"}
    - {id: MTS-OBS-044, at: "2026-09-08", stage: S5, area: security_defect_found_and_fixed, severity: high, statement: "On the hosted Supabase project, role `anon` could execute public.redact_expired_inquiries() and public.redact_inquiry() - the retention and manual-deletion functions. Any visitor holding the publishable key could have wiped inquiry content.", cause: "A hosted Supabase project ships `alter default privileges in schema public grant all on functions to anon, authenticated, service_role`, so every function created by the migration was born with a DIRECT execute grant to the application roles. The migration revoked from PUBLIC, which removes only the privilege held through PUBLIC and does not touch a direct grant. The local development container carries no such default, so the same migration produced a correct privilege set locally and an unsafe one hosted.", found_by: "Applying the schema to the isolated hosted project and running the deny checks there. The assertions were already correct and had passed locally 12/12 on every run since implementation - they had simply never been run in the environment where the default privileges differ.", fix: "The grant block now revokes from `public, anon, authenticated` BY NAME on all four functions before granting execute on the two submission-path functions to anon. Re-applied and re-verified on the hosted project: RLS on both tables, zero policies, zero table grants to either application role, anon holds execute on submit_inquiry and record_inquiry_delivery only.", control_added: "supabase/inquiry/tests/authorization-checks.sql was split out of inquiry-checks.sql, free of psql meta-commands, so the same assertions run in both places: `pnpm inquiries:check` locally and `pnpm inquiries:check:hosted` against the real project through the Supabase Management API, which needs no database password. The hosted runner was negative-tested - the grant was deliberately restored, the checker failed with the exact privilege named, and it passed again once revoked.", lesson: "A privilege assertion proves nothing about an environment it has not run in. Any future schema applied to a hosted project must have its deny paths re-run there.", status: confirmed, confirmed_by: Josh Coley, confirmed_at: "2026-09-08"}
    - {id: MTS-OBS-043, at: "2026-09-08", stage: S5, area: route_paths, statement: "Two small placement facts. INTEGRATION-MANIFEST writes the inquiry route as src/app/api/inquiries/route.ts; this repository was initialised without a src directory, so it is app/api/inquiries/route.ts - the segment path is the manifest's and the root is the repository's, as with every route since P0. Separately, components/layout/pending-route.tsx is now referenced by no route, MTS-DEV-002 being resolved.", disposition: "No boundary changes. The pending-route component is retained as the approved build-state treatment rather than deleted, so a future slice needing it does not re-invent it.", status: confirmed, confirmed_by: Josh Coley, confirmed_at: "2026-09-08"}
    - {id: MTS-OBS-033, at: "2026-09-07", stage: S4, area: evidence_scope, statement: "The case study narrates THIS review rather than a client engagement. It describes the fixture, the checks, the failures, the fixes, the repeated checks, and the limits of what any of it proves.", rationale: "MDS requires a case-study outcome in section 8 of the report shell. The only engagement whose outcome is evidenced in this repository is the lab's own, and narrating a client would mean inventing one - prohibited by MPS-RULE-001 and MPS-RULE-007. It also promises no timeline, price, finding, certification, or outcome (MPS-RULE-005, MPS-REQ-011).", note: "It includes the two PostgreSQL behaviours from MTS-OBS-009, which the owner directed be carried into the S3 and S4 review checklists: they are now published to buyers as evidence that the fixture was not written to a predetermined answer.", status: approved, approved_by: Josh Coley, approved_at: "2026-09-07", approval_note: "Approved as part of the owner's ruling on the six S4 checkpoint observations, 2026-09-07. Each records a decision already taken or an implementation already shipped and verified; none required further work."}
    - {id: MTS-OBS-020, at: "2026-09-07", stage: S3, area: evidence_integrity, statement: "An end-state count alone can be satisfied by compensating errors, and would have published a broken handler as remediated.", detail: "Documented sequence REL-003 delivers a failure, its retry, and then a manual dashboard replay of the same logical event. Under the vulnerable handler the retry is discarded as a duplicate (the work is lost) AND the later replay is committed as new, so the final commitment count for the target invoice is 1 - exactly what the correct handler produces. Every individual decision was wrong and the totals still matched.", resolution: "Each documented step may declare a checkpoint - how many commitments must exist immediately after it - and a sequence is met only if the end state AND every checkpoint hold. REL-003 now reports vulnerable, as it must. The checkpoint mechanism is registered in synthetic.documented_steps.expected_commitments_after and asserted by a unit test that would fail if the accidental-pass behaviour ever returned.", status: resolved}
    - {id: MTS-OBS-021, at: "2026-09-07", stage: S3, area: evidence_integrity, statement: "The sequence runner originally caught every exception and reported it as a legitimate rollback, so a defect in the harness was indistinguishable from correct recovery behaviour.", detail: "The remediated handler proves recovery by RAISING so its ledger claim unwinds with the work; the runner records that as failed_and_rolled_back. With `when others`, an ambiguous-column bug in the handler produced the same recorded decision - and it actually did during development, caught only because the commitment counts were zero everywhere.", resolution: "Both the runner and the vulnerable handler now catch only connection_failure, the SQLSTATE of the injected downstream fault. Anything else propagates and fails the recording loudly rather than being published as evidence.", status: resolved}
    - {id: MTS-OBS-022, at: "2026-09-07", stage: S3, area: security_boundary, statement: "The S2 and S3 request schemas were non-strict zod objects, so an unexpected key was silently ignored rather than refused.", detail: "A POST carrying {scenarioId, mode, endpoint: '...'} or a payload field was stripped and served as if it had never asked. Nothing reads those keys, so this was not exploitable - but this slice's claim to buyers is that the request surface is exactly two enumerated fields, and behaving well by accident is not the same as refusing.", resolution: "Both executors now use z.strictObject and both suites assert that extra keys are rejected. Found by a test written for S3 and applied to the S2 executor as well, since one strict and one lax boundary would be worse than either.", status: resolved}
    - {id: MTS-OBS-023, at: "2026-09-07", stage: S3, area: fixture_isolation, statement: "The replay fixture holds no foreign key to the five S2 fixture tables, and this is required rather than incidental.", detail: "synthetic.reset_fixture() truncates those tables and PostgreSQL refuses to truncate a table that a foreign key references, so a reference from the replay fixture would break the S2 reset path. The invoice is carried as its number and the tenant as its uuid, matching the S2 seed by value. The same applies to the documented-step registry, which names deliveries by id with no FK because reset_replay_fixture() truncates the deliveries table; an unknown delivery id is caught by a check in the documented set instead.", verification: "A safety check asserts the replay reset clears only the replay tables, leaves a public-schema probe intact, and does NOT reseed the S2 fixture. Re-recording confirmed the S2 transcript is byte-identical apart from its timestamp and the shared digest.", status: recorded}
    - {id: MTS-OBS-024, at: "2026-09-07", stage: S3, area: evidence_scope, statement: "The webhook signature check was originally an md5 stand-in, disclosed as one everywhere it appeared. On owner direction it is now HMAC-SHA256 via pgcrypto.", original_reasoning: "The fixture was written without pgcrypto on the assumption that no cryptographic strength was needed to demonstrate the control, which is that the receiver RECOMPUTES and refuses a mismatch. That reasoning was sound and the disclosure was honest, but the premise was wrong: pgcrypto ships with the Supabase image and is already installed in the extensions schema, so md5 was a choice rather than a constraint. A security lab showing md5 in a signature demonstration spends credibility it does not need to spend.", resolution: "Migration 20260907000004 declares create extension if not exists pgcrypto with schema extensions and synthetic.expected_signature() now returns encode(extensions.hmac(canonical_payload, material, 'sha256'), 'hex'). The call is schema-qualified because the function runs with an empty search_path.", residual_limitation: "The signing material is invented rather than provider-issued, and the canonical string is this fixture's own construction rather than any provider's documented signing format. The buyer-facing limitation now states exactly that, and that a real integration must build the string its provider specifies - normally the raw request body with a timestamp header - and verify it with the provider's own library. This is a scope statement about the fixture, no longer a caveat about the algorithm.", control: "Unchanged and slightly widened. The invented signing string never reaches a transcript: it is in the recorder's forbidden-pattern list, in the freshness gate, in a unit test, and in a browser test. The digest-shape guards in tests/unit/replay-executor.spec.ts and e2e/s3-replay.spec.ts were widened from [0-9a-f]{32} to [0-9a-f]{32,} so both md5- and sha256-length digests are refused. A new SQL safety check asserts the computed signature is 64 hex characters AND equals the HMAC of the canonical payload under the signing material, so a silent regression to a weaker or unkeyed digest fails the gate.", verification: "Both transcripts re-recorded; the only changes are the timestamp, the shared input digest, and the signature_algorithm description. No signature value appears in either transcript, as before - the evidence records whether each signature verified, never the value.", status: resolved}
    - {id: MTS-OBS-027, at: "2026-09-07", stage: S3, area: verification_integrity, statement: "The local browser suite serves `next dev`, not the production build, and a dev-only overlay control was being asserted against as if it were product UI.", detail: "playwright.config.ts runs `pnpm build && pnpm start` only when CI is set; locally it runs `pnpm dev` and reuses any server already on the port. The Next.js dev-tools overlay injects a 32x32 button[aria-controls], which the S1 touch-target selector matched, so 'primary actions meet the 44px touch-target minimum' failed in all five projects - deterministically, in about 3 seconds, as a real assertion rather than a timeout. It reproduces on the committed branch head with every S3 change stashed, so it predates this work.", significance: "Two separate problems. The selector reached outside the application and asserted the approved 44px minimum against third-party injected UI. And the local suite has been exercising a development build - different bundling, an injected overlay, no production optimisation - while CI exercises the production build. The recorded S3 verification described 405 local checks against a from-clean production build; that description was wrong for the local runs, which served next dev. The CI evidence in MTS-OBS-019 is unaffected and remains the authoritative browser result.", resolution: "The selector is now scoped to the application's own header, main and footer landmarks, with the reason stated inline. The test passes; the assertion and the 44px threshold are unchanged.", residual_resolution: "The owner directed on 2026-09-07 that Playwright serve the production build by default. playwright.config.ts now runs `pnpm build && pnpm start` in every environment with reuseExistingServer false, recorded as MTS-DEC-011. The landmark scoping is kept regardless: the assertion should not depend on nothing ever being injected into the page again.", status: resolved}
    - {id: MTS-OBS-026, at: "2026-09-07", stage: S3, area: verification_integrity, statement: "pnpm evidence:verify ran the SQL fixture safety checks against whatever schema the database already held, before any reset — so the checks could be answered by a database left over from an earlier session.", how_found: "The MTS-DEC-010 signature change surfaced it. The first verify run after the change reported FAIL for the safety checks; run in isolation moments later, against the same database, the identical file passed. The database was still up from a previous session carrying the pre-change migrations, so the new assertion that expected_signature() returns a 64-character digest was correctly failing against the OLD md5 function while the file itself was fine.", significance: "It failed in the safe direction this time, but the ordering is symmetric: the same gate would just as readily report PASS for safety checks a stale schema happened to satisfy, while the reruns rebuilt and tested something else. That is MTS-OBS-014 again in a different place — evidence reported against a build that is not the build under test.", resolution: "The safety-check step in scripts/verify-evidence.mjs now runs LAST, after both reruns. Each rerun performs a full supabase db reset, so the schema the checks interrogate is guaranteed to be the migrations under test. The reason is stated in the file so the order is not tidied away later.", note: "The checks do not migrate the database themselves and are not being changed to; making the gate order explicit is the smaller and more honest fix.", status: resolved}
    - {id: MTS-OBS-025, at: "2026-09-07", stage: S3, area: verification_integrity, statement: "Two browser-suite defects were found and fixed in the S3 test helpers, both of which would have made the suite green for the wrong reason.", detail: "(1) The remediated-run helper waited for the 'After - remediated handler' heading, which the comparison renders as soon as the vulnerable run exists, above the untested placeholder. The wait returned immediately and assertions raced a render of eight code excerpts and eight ledger tables; it failed on desktop and tablet, then on mobile, while passing at wide. It now waits for the untested placeholder to disappear, which is the only condition true before the repeated run and false after it. (2) The vulnerable-run helper waited for the first pair rather than all four.", status: resolved}
  changes:
    - {id: MTS-CHG-018, at: "2026-09-09", by: Claude, stage: S6, summary: "Opened the S6 slice record and satisfied the last outstanding owner prerequisite. vercel_project moves from pending to satisfied: the owner connected the repository to Vercel on 2026-09-09 and supplied the deployment URL. current_slice moves from not_started to in_progress and names its branch. Recorded MTS-OBS-047, the third-party apt source that is currently failing the CI verification gate on main.", authority: "Owner instruction 2026-09-09: the project is hooked up to Vercel, with the URL provided, and an instruction to continue with S6.", verification: "The deployment was checked by request rather than accepted by report. All six approved routes answer 200, and the served HTML was confirmed to contain the merged S6 build - the centred service-boundary block and the inquiry back-path links - so the URL is not answering from an earlier deployment. MTS-OBS-014 is why that second check was made.", scope_note: "mts_version remains v0.6-draft and mds_version remains v1.0. Bookkeeping and one observation only; no application code, no dependency, no capability selection, and no security or architecture decision changed. MTS-CAP-008 still carries approved_selection: null - connecting Vercel does not select a measurement provider, and no part of this change implies one.", remaining: "The preview environment, the release and rollback controls of MTS-CAP-011, production environment values, and a preview-safe Resend destination are all still S6 work and none is done. The measurement boundary remains blocked on an owner decision, and the CI gate remains red under MTS-OBS-047.", scope: "mts/MTS-PROJECT-STATE.yaml, mts/MERCURIUS-BUILD-ROADMAP.md; no application code."}
    - {id: MTS-CHG-017, at: "2026-09-08", by: Claude, stage: S5, summary: "Corrected the owner-prerequisite ledger, which still described S5 as unprovisioned and contradicted the S5 record recorded below it. supabase_isolated_environments moves from partially_satisfied to satisfied - the hosted inquiry project was provisioned and verified by MTS-CHG-014. private_environment_values moves from pending to satisfied - .env.local carries the project URL and publishable key and INQUIRY_DATABASE_URL is a configured repository secret, proven by the first retention run. resend_verified_domain_and_preview_safe_destination moves from pending/S5 to partially_satisfied/S6 - the real send is done (MTS-OBS-042), while the production from-domain and a preview-safe destination are S6 release work. vercel_project is unchanged and remains the one genuinely outstanding prerequisite.", authority: "Owner instruction 2026-09-08 to correct the ledger after it was found to disagree with the S5 record.", finding: "No functional gap - the work was done and the ledger was not updated with it. A reader coming to the state file cold would have concluded S5 was unfinished.", scope: "mts/MTS-PROJECT-STATE.yaml, mts/MERCURIUS-BUILD-ROADMAP.md; no application code."}
    - {id: MTS-CHG-016, at: "2026-09-08", by: Claude, stage: S5, summary: "Closed S5 out. PR #8 merged to main as c3515f8 and the post-merge verify run went green on all three jobs (run 34277038707). The retention workflow, which GitHub would not let be dispatched until it sat on the default branch, was dispatched and observed for the first time (run 34277980502): 0 records due on the dry run, 0 redacted on the real pass, counts only in the log. MTS-OBS-039 moves from resolved_pending_owner_secret to resolved, MTS-CAP-007 and MTS-CAP-012 validation statuses now describe verified rather than pending halves, and the slice pointer moves to S6.", authority: "Owner instruction 2026-09-08 to close the outstanding S5 items before starting S6.", scope: "mts/MTS-PROJECT-STATE.yaml, mts/MERCURIUS-BUILD-ROADMAP.md; no application code."}
    - {id: MTS-CHG-015, at: "2026-09-08", by: Claude, stage: S5, summary: "Recorded the owner's confirmation of MTS-OBS-044, 045 and 046, closing the last open S5 items. No S5 observation, gap, exception, or deviation remains open. Corrected the branch reference to slice/s5-inquiry and opened PR #8.", authority: "Owner confirmation 2026-09-08 of the three defect and convention records.", scope_note: "Governance bookkeeping only. mts_version remains v0.6-draft and mds_version remains v1.0. No code, migration, schema, evidence, transcript, or test changed - the three fixes those observations describe were already implemented and verified before the confirmation was sought.", rules_now_binding: ["A deny assertion proves nothing about an environment it has not run in. Any schema applied to a hosted project must have its deny paths re-run there (MTS-OBS-044).", "An operator guard distinguishes environments by host, never by database name (MTS-OBS-045).", "No credential-shaped literal enters this repository, not even a published example. Assemble it at runtime, and never resolve a push-protection block by allowlisting (MTS-OBS-046)."], remaining_for_s6: ["Edge rate limiting (MTS-OBS-037).", "A verified from-domain for production and delivery from a deployed preview (MTS-OBS-042).", "pnpm inquiries:check:hosted as a release gate against the preview and production projects (MTS-OBS-044)."]}
    - {id: MTS-CHG-014, at: "2026-09-08", by: Claude, stage: S5, summary: "Provisioned the S5 inquiry store against the owner's isolated hosted Supabase project (ref vorxftvgvycrgduenark, created 2026-09-08). Applied both inquiry migrations through the Supabase Management API, found and fixed a high-severity privilege defect that existed only in the hosted environment (MTS-OBS-044), split the authorization assertions into a runner-independent file, added `pnpm inquiries:check:hosted`, wrote the project URL and publishable key into the owner's gitignored .env.local, and verified the whole path end to end.", authority: "Owner instruction 2026-09-08 to handle the connection string and provisioning now that the project exists.", defect: "anon could execute the retention and manual-deletion functions on the hosted project. Fixed by revoking from anon and authenticated BY NAME rather than from PUBLIC alone, then re-applied and re-verified.", verification: "Hosted: RLS on both tables, zero policies, zero table grants to anon or authenticated, anon holds execute on the two submission functions only; the publishable key was probed directly over PostgREST and denied on both a table read (42501) and the retention function (42501). End to end through the running application: a first submission returned acknowledged with delivered:true and wrote exactly one row with one delivery event; the same submission again returned duplicate with the original timestamp and submission_count 2 and wrote no second row; a submission carrying an sk_live key was refused with 422 before persistence; an unsettled authorization was accepted and flagged at the boundary. Local: 12/12 SQL checks still green. The hosted checker was negative-tested by restoring the bad grant, observing the failure, and revoking again.", cleanup: "All four harness rows were deleted from the owner's store; it now holds zero inquiries and zero delivery events.", scope_note: "mts_version remains v0.6-draft. No capability, provider, or approved-selection decision changed. No service-role key was configured, read, or written anywhere - the secret key exists in the project as Supabase creates it, and nothing in this repository uses it. No credential value appears in source, logs, or evidence."}
    - {id: MTS-CHG-013, at: "2026-09-08", by: Claude, stage: S5, summary: "Acted on the owner's S5 checkpoint ruling. Recorded MTS-OBS-034, 035, 036, 040, 041 and 043 as confirmed. Confirmed MTS-OBS-037 as the R1 abuse control with edge limiting carried to S6. Implemented the MTS-OBS-038 ruling: a duplicate now sends a distinct follow-up alert that cannot be read as a new inquiry, while still creating no second record. Resolved MTS-OBS-039 by adding .github/workflows/retention.yml, recorded as MTS-DEC-015. Resolved MTS-OBS-042 by sending one real notification through the shipped path on owner instruction, with the live check gated behind INQUIRY_LIVE_DELIVERY=1.", authority: "Owner ruling 2026-09-08 on the S5 checkpoint: six confirmations, one decision on abuse control, one decision changing duplicate notification behaviour, one decision on retention scheduling, and an instruction to test the notification path.", scope_note: "mts_version remains v0.6-draft and mds_version remains v1.0. No capability, provider, security-architecture, or approved-selection decision was changed beyond MTS-DEC-015, which fills a scheduling mechanism that was previously unassigned. The evidence engine, both transcripts, their digest, supabase/migrations and supabase/tests are untouched. No dependency was added. The follow-up alert changes what the OPERATOR sees; no buyer-facing state, wording, or outcome changed, and MPS-RULE-006 is unaffected - the record count and engagement count both stay at one.", verification: "125 unit tests green (1 skipped: the gated live delivery check); typecheck clean; one real message accepted by Resend.", remaining: "MPS-REQ-015 is satisfied by an available command and a scheduled workflow that no-ops until INQUIRY_DATABASE_URL is added as a repository secret. The isolated hosted inquiry Supabase project does not exist yet, so preview and production still store nothing."}
    - {id: MTS-CHG-012, at: "2026-09-08", by: Claude, stage: S5, summary: "Implemented S5, the authorized-review inquiry path, on branch slice/s5-inquiry-path. Added an isolated inquiry schema in its own migration set and its own database (two tables, four functions, no exposed table), server-side validation with a credential guard, a bounded opaque deduplication key, abuse control and deduplication inside the write path, the Supabase persistence client, the Resend operator-notification boundary, 12-month retention with an earlier manual-deletion path and two operator commands, the approved MDS form controls, and the approved two-column inquiry shell with all eight required states at /inquiry. Moved current_phase and current_slice to S5, recorded S4 as approved under previous_slice, resolved MTS-DEV-002, re-controlled the MTS-RISK-001 residual with an enforced import boundary, moved MTS-CAP-007 and MTS-CAP-012 to implemented, recorded MTS-DEC-012/013/014, and opened MTS-OBS-034 through MTS-OBS-043.", authority: "Owner instruction 2026-09-08 to implement Slice 5, plus three owner decisions taken at the S5 pre-implementation checkpoint: verify the store against an isolated local database, run retention as an operator command, and send no real notification without a second confirmation.", scope_note: "S5 status and roadmap position only. mts_version remains v0.6-draft and mds_version remains v1.0. No account, billing, scheduling, contract, engagement acceptance, live scanning, or upload path was added. The evidence engine, both committed transcripts, their digest, supabase/migrations, and supabase/tests are untouched - the inquiry schema is a separate set and is deliberately outside the recorder's input digest. One dependency was added, `server-only` (MTS-OBS-040), a Next.js-documented framework guard that adds no provider or runtime behaviour. No service-role key is read anywhere.", verification: "12 SQL inquiry checks green against a real database built from the inquiry migrations; 124 unit tests green including 33 new; 23 new browser checks per project; pnpm check green from a deleted .next.", not_verified: "The Resend delivery half has never sent a real message (MTS-OBS-042), and retention is unscheduled (MTS-OBS-039)."}
    - {id: MTS-CHG-011, at: "2026-09-07", by: Claude, stage: S4, summary: "Recorded the owner's confirmation of MDS-GAP-S4-001, closing the last open S4 item. The print appearance of the report is now an approved MDS decision rather than an implemented-but-undecided one: the print medium redefines the approved tokens instead of introducing print-only values, and the anchor-based section index, the copy button, and unselected excerpt tabs are the confirmed set of controls dropped on paper. Marked the gap resolved in both state files, closed it in the MDS state as MDS-CHG-003, moved current_slice S4 to approved, added S4 to completed_slices, and corrected the S3 completed_slices row, which still said PR #5 was unmerged - it merged as 89a469f.", authority: "Owner confirmation 2026-09-07 of the print treatment as implemented.", scope_note: "Governance bookkeeping only. mts_version remains v0.6-draft and mds_version remains v1.0. No approved token value was altered - the confirmed decision is that the print medium re-resolves existing tokens, so the screen palette, type scale, spacing, radii, borders, and motion tokens are untouched. No application, migration, evidence, or test file changed, and no code was needed to close the gap: what was missing was an MDS decision on record, not an implementation. Both committed transcripts and their digests are untouched.", rule_established: "Any future printable surface flips the approved tokens for the print medium, never authors a print-only colour, and drops only controls that cannot function on paper. Evidence, state, limitation, recovery, and the CTA are never dropped for print.", status_note: "S4 is approved with no open gaps, exceptions, or deviations. S5 may begin. PR #6 is green on all three CI jobs and awaits merge."}
    - {id: MTS-CHG-010, at: "2026-09-07", by: Claude, stage: S4, summary: "Acted on the owner's S4 checkpoint ruling. Recorded MTS-OBS-028 through MTS-OBS-033 as approved. Four of the six restate decisions the owner had already taken at the S4 pre-implementation checkpoint (028 the two-column written-MDS composition, 029 the static fully-expanded findings list, 031 the published ranking rule, 033 the case study narrating this review); 030 records the derived/authored module split and 032 records two responsive defects found and fixed during implementation. None required further implementation - all six were already shipped and verified in MTS-CHG-009. Also mirrored MDS-GAP-S4-001 into the MDS state as MDS-CHG-002, on separate owner instruction.", authority: "Owner ruling 2026-09-07 on the S4 checkpoint observations, and owner instruction 2026-09-07 to mirror the gap into the MDS state.", scope_note: "Governance bookkeeping only. mts_version remains v0.6-draft and mds_version remains v1.0. No capability, architecture, security, provider, or approved-selection decision was changed, no dependency was added, and no application, migration, evidence, or test file changed. Both committed transcripts and their digests are untouched.", still_open: "MDS-GAP-S4-001 remains open and awaits an MDS decision on the print appearance. S4 is therefore not fully approved and S5 does not begin, so current_slice moves to observations_approved_awaiting_mds_gap_decision rather than to approved.", verification: "Both state files parse; pnpm format:check clean; pnpm check green."}
    - {id: MTS-CHG-009, at: "2026-09-07", by: Claude, stage: S4, summary: "Implemented S4, the severity-ranked report and case study, on branch slice/s4-report-case-study. Added the derived report model (lib/evidence/report.ts), the authored report narrative (lib/content/report.ts), five report components, and the eight approved report sections at /report. Populated the landing hero evidence snapshot and the landing report preview from the same derived model, resolving MTS-DEV-001. Added print behaviour by redefining the approved tokens for the print medium. Moved current_slice to S4, recorded S3 as approved under previous_slice, resolved MTS-DEV-001, resolved the /report half of MTS-DEV-002, opened MDS-GAP-S4-001, and opened MTS-OBS-028 through MTS-OBS-033.", authority: "Owner instruction 2026-09-07 to implement Slice 4, plus three owner decisions taken at the S4 pre-implementation checkpoint: the two-column written-MDS report composition, the static fully-expanded findings list, and populating both deferred landing regions.", scope_note: "S4 status and roadmap position only. No capability, architecture, security, provider, or approved-selection decision was changed; mts_version remains v0.6-draft. No dependency was added. No inquiry capture, notification, authentication, billing, live scanning, or new server entry point was implemented - the report route is a static server component that reads the committed transcripts and opens no connection. Two read helpers were added to the S3 replay module (allRecordedSequences, recordedHandler) alongside the existing S2 equivalents; the bounded request allowlist is unchanged and remains the only path a request can take."}
    - {id: MTS-CHG-008, at: "2026-09-07", by: Claude, stage: S3, summary: "Acted on the owner's S3 checkpoint direction. Replaced the md5 signature stand-in with pgcrypto HMAC-SHA256 (MTS-DEC-010) and rewrote MTS-OBS-024 as resolved, narrowing the buyer-facing limitation from a statement about the algorithm to one about fixture scope. Made the browser suite build and serve production in every environment with no server reuse (MTS-DEC-011), closing MTS-OBS-027. Fixed the evidence-verify gate ordering so the SQL safety checks can no longer be answered by a stale schema (MTS-OBS-026). Widened the digest-shape guards to refuse sha256-length values while excluding the transcript's own provenance digest. Corrected the S3 verification note, which had described local browser runs as production-build runs when they were not.", verification: "pnpm check green from a deleted .next. pnpm evidence:verify green on all 8 steps, including two clean-database re-recordings reproducing both committed transcripts byte for byte and the new HMAC safety check. Full Playwright suite green: 405 passed, 0 failed, at 1 worker against a self-built production build.", note: "MTS-OBS-027 was found because the MTS-DEC-010 change prompted a full browser run; it reproduces on the committed branch head with every change stashed, so it predates this work and was not introduced by it."}
    - {id: MTS-CHG-007, at: "2026-09-07", by: Claude, stage: S3, summary: "Implemented S3, the webhook replay/idempotency and failure/recovery proof, under the recorded-and-disclosed posture established by MTS-DEC-008.", delivered: "Two migrations adding a synthetic delivery fixture, an idempotency ledger, a payment-commitment table, deterministic fault injection, and one configuration-driven handler; a documented-sequence registry and runner with per-step checkpoints; eight documented sequences in supabase/tests/documented-sequences.sql; a second recorded transcript; a separate bounded replay executor and Server Action with its own closed allowlist; and the replay lab, delivery ledger, before/after comparison, and context panel composed from approved MDS components.", boundary: "The application publishes no webhook endpoint, accepts no event body, signature, or delivery from anyone, and holds no database connection. A browser test asserts that seven plausible webhook routes all return 404.", scope_note: "No product, design, or technology decision was invented. MPS-REQ-006/007/012 and MPS-ACC-007/008/014 are the governing requirements; no MDS gap was opened."}
    - {id: MTS-CHG-006, at: "2026-09-06", by: Claude, stage: S2, summary: "Acted on the owner's S2 checkpoint rulings. Confirmed MTS-OBS-006, MTS-OBS-007 and MTS-OBS-008 as implemented. Wired the CI verification gate at .github/workflows/verify.yml and recorded the provider selection as MTS-DEC-009, resolving MTS-OBS-016 ahead of S6. Closed MDS-GAP-S1-001 with the approved color.border.control token and MDS-GAP-S1-002 with the COMPONENTS-PROPOSAL evidence-state shapes, both recorded as MDS-CHG-001.", authority: "Owner decisions 2026-09-06 on the S2 checkpoint report.", scope_note: "No product scope, capability, provider, framework, or data decision changed; mts_version remains v0.6-draft and mds_version remains v1.0. No dependency was added. The evidence transcript and its digest are untouched, and pnpm evidence:verify still reproduces it byte for byte.", judgement_recorded: "No Request excerpt tab was added despite the owner allowing one, because there is no HTTP request in a documented test and the tab could only be filled by inventing evidence (MPS-RULE-007). Stated rather than silently skipped.", incidental_fix: "components/evidence/coverage-matrix.tsx held a second, independent state-to-glyph table that had already drifted from the evidence-state component. It now reads the canonical mapping through evidenceStateGlyph and evidenceStateForeground, so a matrix cell cannot show a different mark than the same state shows in a panel."}
    - {id: MTS-CHG-005, at: "2026-09-06", by: Claude, stage: S2, summary: "Acted on the owner decision confirming MTS-OBS-005. Recorded the recorded-and-disclosed posture as MTS-DEC-008, added the database-free transcript freshness gate (scripts/check-evidence-freshness.mjs, scripts/evidence-inputs.mjs, tests/unit/evidence-freshness.spec.ts, the evidence:check and check package scripts) and made it the first step of evidence:verify, and added the buyer-visible reproducibility statement to the evidence provenance caption and the scenario limitation note. Opened MTS-RISK-006 as controlled and MTS-OBS-016.", authority: "Owner decision 2026-09-06 on the S2 checkpoint: confirm recorded-and-disclosed, add the two recommended additions, add no live scanning.", scope_note: "No capability, provider, framework, or architecture selection changed; mts_version remains v0.6-draft. No dependency was added. The digest function was moved from scripts/record-evidence.mjs into scripts/evidence-inputs.mjs and is unchanged, so the committed transcript and its digest are untouched. No MDS component, token, or visual convention was introduced; the two copy changes extend an existing caption and an existing limitation note."}
    - {id: MTS-CHG-004, at: "2026-09-06", by: Claude, stage: S2, summary: "Implemented S2, the deterministic bounded evidence engine and RLS proof, on branch slice/s2-evidence-rls. Added the synthetic multi-tenant fixture, the two documented policy modes, the offline documented-test harness and recorder, the committed evidence transcript, the bounded server-side executor, and the guided lab with evidence panels, per-test before/after comparison, and the RLS coverage matrix. Moved current_phase and current_slice to S2, recorded S1 as approved and completed, moved MTS-RISK-001 and MTS-RISK-002 to controlled, and opened MTS-OBS-005 through MTS-OBS-015.", authority: "Owner instruction 2026-09-06 to proceed with Slice 2 only", scope_note: "S2 status and roadmap position only. No capability, architecture, security, provider, or approved-selection decision was changed; mts_version remains v0.6-draft. No webhook replay, report, inquiry capture, notification, authentication, or billing was implemented. No dependency was added: the fixture harness uses the already-approved Supabase CLI and psql, and the unit tests run on the already-approved Playwright Test."}
    - {id: MTS-CHG-003, at: "2026-09-06", by: Claude, stage: S1, summary: "Acted on owner S1 feedback: re-cut the icon set against zoomed crops of the canonical references, moved evidence state to the approved filled-badge treatment, corrected the reliability scenario icon to the clock, ran a measured contrast audit and fixed three AA failures of my own composition, added a browser-measured contrast check to the S1 suite, and opened MDS-GAP-S1-001 and MDS-GAP-S1-002.", authority: "Owner instruction 2026-09-06", scope_note: "S1 scope only. No approved token value was changed; the two contrast findings that trace to approved tokens are reported as MDS gaps rather than silently altered."}
    - {id: MTS-CHG-002, at: "2026-09-06", by: Claude, stage: S1, summary: "Implemented S1, the public MDS shell and scenario navigation, on branch slice/s1-public-mds-shell. Moved current_phase and current_slice to S1, recorded P0 as a completed slice, and opened MTS-DEV-001, MTS-DEV-002, MTS-OBS-001, and MTS-OBS-002.", authority: "Owner instruction 2026-09-06 to proceed with Slice 1 only", scope_note: "S1 status and roadmap position only. No capability, architecture, security, provider, or approved-selection decision was changed; mts_version remains v0.6-draft. No evidence execution, inquiry persistence, authentication, or billing was implemented."}
    - {id: MTS-CHG-001, at: "2026-09-06", by: Claude, stage: P0, summary: "Refreshed stale delivery facts (workspace path, git repository presence, runtime versions, framework initialization, package scripts), recorded the observed Claude skill inventory and environment-variable contract, added .env.example as the environment contract, opened current_phase P0, closed MTS-RISK-005, and recorded MTS-EXC-001 and MTS-EXC-002.", authority: "Owner instruction 2026-09-06", scope_note: "Delivery and governance bookkeeping only. No capability, architecture, security, or approved-selection decision was changed; mts_version remains v0.6-draft."}
