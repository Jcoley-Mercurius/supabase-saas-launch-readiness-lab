project:
  name: "Supabase SaaS Launch-Readiness Lab"
  description: "A public service-proof product combining a guided synthetic SaaS audit lab, buyer-readable evidence, a sample report, and an authorized-engagement inquiry path."
  product_type: public portfolio experience and synthetic audit lab
  users:
    - SaaS founders and product owners
    - Agencies and development teams
    - Upwork prospects and portfolio reviewers
    - Josh Coley as operator and service provider
  platforms: [responsive_web, upwork_portfolio]
  business_stage: greenfield_production_planning
  scope:
    - Public positioning and guided scenario entry
    - Synthetic multi-tenant context and deterministic evidence
    - Authorization, RLS, storage, configuration, webhook, and recovery proof
    - Severity-ranked sample report and case study
    - Authorized-review inquiry path
  out_of_scope:
    - Live scanning, buyer uploads, production credentials, and customer data
    - Client accounts, client portal, billing, scheduling, and contracts
    - Formal penetration testing, certification, and compliance attestation
    - Automated buyer risk scoring
  constraints:
    - Synthetic or explicitly authorized data only
    - Public R1 requires no buyer account
    - No real payment processing is required for the synthetic webhook proof
    - Vulnerable, remediated, untested, unavailable, running, and not-applicable states remain distinct
    - Inquiry acknowledgement cannot imply engagement acceptance, price, timeline, or outcome
    - Duplicate inquiries cannot create or imply duplicate engagements
    - Target WCAG 2.2 AA and the approved evidence-preserving responsive composition
    - Josh works from WSL/Ubuntu and uses Codex and Claude as implementation agents
  scale_assumptions:
    - {statement: "R1 is a low-traffic public portfolio product, not a high-volume customer platform.", status: approved, approved_by: Josh Coley}
    - {statement: "Target a $50 monthly operating ceiling at launch while preserving an incremental scaling path.", status: approved, approved_by: Josh Coley}
  regulatory_context:
    - "No regulated, customer, payment-card, or production SaaS data is approved for R1."
    - "High-level inquiry contact data is the only intended personal data class; MPS v1.1 limits inquiry-content retention to 12 months after latest activity or earlier manual deletion."

