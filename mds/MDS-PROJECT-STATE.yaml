  tabs: {applicability: required, status: approved}
  alert: {applicability: required, status: approved}
  table_matrix: {applicability: required, status: approved}
  navigation: {applicability: required, status: approved}
  evidence_panel: {applicability: required, status: approved}
  before_after_comparison: {applicability: required, status: approved}
  scenario_stepper: {applicability: required, status: approved}
  finding_summary: {applicability: required, status: approved}
  code_or_log_excerpt: {applicability: required, status: approved}
  dialog: {applicability: optional, status: approved}
  pagination: {applicability: not_applicable, status: undefined}
