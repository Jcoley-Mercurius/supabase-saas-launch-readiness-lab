mds:
  system: Mercurius Design System
  schema_version: "1.2"
  project_id: POB-2026-36-02-MDS
  project_name: Supabase SaaS Launch-Readiness Lab
  lifecycle: approved
  mds_version: v1.0
  current_gate: implementation_readiness
  mps_project_id: POB-2026-36-02
  mps_version: v1.1
  created_at: "2026-09-05"
  updated_at: "2026-09-06"

project:
  name: Supabase SaaS Launch-Readiness Lab
  description: A public service-proof product combining a guided synthetic SaaS audit lab, buyer-readable evidence, a sample report, and an authorized-engagement inquiry path.
  product_type: public portfolio experience and interactive evidence lab
  audience:
    - SaaS founders and product owners
    - Agencies and development teams
    - Upwork prospects and portfolio reviewers
  platforms: [responsive_web]
  primary_experience: Understand the risk, inspect reproducible evidence, compare vulnerable and remediated states, review the report, and request an authorized engagement.
  scope:
    - Public positioning and guided scenario entry
    - Synthetic SaaS context
    - Authorization and RLS evidence
    - Storage and configuration evidence
    - Webhook integrity evidence
    - Reliability and recovery evidence
    - Severity-ranked report and case study
    - Inquiry CTA and form states
  out_of_scope:
    - Client portal and authenticated buyer workspace
    - Buyer application uploads and production credentials
    - Billing, scheduling, contracts, and certification UI
  status: design_approved

identity:
  logo: null
  personality: [credible, rigorous, calm, transparent, implementation-aware]
  brand_adjectives: [technical, trustworthy, evidence-led, precise, commercially_clear]
  emotional_response: [confidence, clarity, controlled_urgency]
  visual_direction: "Evidence-led technical studio; polished enough for buyers, rigorous enough for engineers, and distinct from a generic admin dashboard or theatrical hacker aesthetic."
  principles:
    - {id: MDS-PRI-001, statement: "Evidence is the hero.", status: approved}
    - {id: MDS-PRI-002, statement: "Make risk legible without oversimplifying it.", status: approved}
    - {id: MDS-PRI-003, statement: "Trust comes from explicit state and limitation.", status: approved}
    - {id: MDS-PRI-004, statement: "The buyer path stays clear beside technical depth.", status: approved}
  references: []

color:
  primary: {name: brand.primary, value: "#087A5B", role: primary_action, status: approved}
  secondary: {name: brand.ink, value: "#0B1220", role: framing_and_strong_emphasis, status: approved}
  accent: {name: brand.accent, value: "#19A974", role: small_highlights_and_progress, status: approved}
  neutrals: {canvas: "#F4F7F9", base: "#FFFFFF", muted: "#EEF2F5", evidence: "#111827"}
  semantic:
    success: {value: "#087A55", label: remediated_documented_test_blocked, status: approved}
    warning: {value: "#9A5B00", label: caution, status: approved}
    error: {value: "#B42318", label: vulnerable, status: approved}
    info: {value: "#175CD3", label: information, status: approved}
    untested: {value: "#667085", label: untested, status: approved}
  surfaces: {canvas: "#F4F7F9", base: "#FFFFFF", muted: "#EEF2F5", evidence: "#111827"}
  text: {strong: "#111827", muted: "#596579", inverse: "#FFFFFF"}
  borders: {default: "#D6DEE7", control: "#667085", focus: "#2563EB"}
  usage_rules:
    - {statement: "Communicate evidence state with color, icon or shape, label, and explanatory text.", status: approved}
    - {statement: "Use brand accent for small emphasis, not body text on white.", status: approved}

typography:
  display_family: {value: "Geist Sans", status: approved}
  ui_family: {value: "Geist Sans", status: approved}
  mono_family: {value: "Geist Mono", status: approved}
  weights: {regular: 400, medium: 500, semibold: 600, display: 650}
  scale: {display: 56, h1: 44, h2: 32, h3: 24, h4: 20, body_large: 18, body: 16, body_small: 14, label: 13, mono: 13}
  line_heights: {display: 64, h1: 52, h2: 40, h3: 32, h4: 28, body_large: 30, body: 26, body_small: 22, label: 18, mono: 21}
  letter_spacing: {display: "-0.025em", headings: "-0.015em", body: normal, label: "0.01em", mono: normal}
  roles: {marketing_and_headings: "Geist Sans", ui_and_body: "Geist Sans", evidence_and_code: "Geist Mono"}
  usage_rules:
    - {statement: "Use restrained display scale; hierarchy and whitespace establish credibility.", status: approved}
    - {statement: "Body text remains at least 16px in primary reading contexts.", status: approved}

spacing:
  base_unit: {value: 4, unit: px, status: approved}
  scale: {1: 4, 2: 8, 3: 12, 4: 16, 5: 20, 6: 24, 8: 32, 10: 40, 12: 48, 16: 64, 20: 80, 24: 96}
  page_rules: {mobile_gutter: 24, tablet_gutter: 32, desktop_gutter: 48}
  section_rules: {mobile_major: "56-64", desktop_major: "80-96"}
  component_rules: {interior_default: "12-24"}
shape:
  radius: {small: 6, control: 10, card: 14, pill: 999}
  borders: {default: "1px solid border.default", evidence: "tonal separation plus border"}
  dividers: {default: "1px solid border.default"}
  shadows: {card: subtle_low_spread, overlay: restrained_elevated}
  elevation: {philosophy: "Borders and tonal separation first; shadows reserved for true overlays.", status: approved}
icons:
  family: {value: "Lucide-style outline", status: approved}
  implementation: mts_to_select
  stroke_style: "1.75-2px consistent outline"
  fill_style: minimal
  sizes: {small: 16, default: 20, large: 24}
  custom_icon_rules: []
  usage_rules:
    - {statement: "Material evidence states always have adjacent accessible labels.", status: approved}

