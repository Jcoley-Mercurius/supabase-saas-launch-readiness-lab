layout:
  max_content_width: {marketing: 1200, evidence: 1360, reading: 760, status: approved}
  grid: {desktop_columns: 12, desktop_gap: 24, tablet_columns: 8, tablet_gap: 20, mobile_columns: 4, mobile_gap: 16, status: approved}
  gutters: {desktop: 48, tablet: 32, mobile: 24}
  header: {model: "compact global header with product identity, report link, and authorized-review CTA", status: approved}
  sidebar: {model: "scenario navigation rail on wide screens; collapses to selector on tablet/mobile", status: approved}
  footer: {model: "limitations, privacy/contact, and Josh/Mercurius endorsement", status: approved}
  section_spacing: {desktop: "80-96", mobile: "56-64", status: approved}
  page_shells:
    public_marketing: {status: approved}
    guided_lab: {status: approved}
    report_case_study: {status: approved}
    inquiry: {status: approved}

responsive:
  breakpoints: {mobile: 0, tablet: 640, desktop: 960, wide: 1280}
  rules:
    stacking:
      - {statement: "Paired proof becomes ordered vulnerable-then-remediated flow below desktop.", status: approved}
      - {statement: "Report and inquiry sidebars move inline below desktop.", status: approved}
    navigation:
      - {statement: "Desktop global navigation stays visible; mobile uses a compact accessible menu without hiding the report or CTA.", status: approved}
    sidebar:
      - {statement: "Scenario rail becomes an in-flow scenario selector below 960px.", status: approved}
    grid:
      - {statement: "Four scenario cards render 4-up wide, 2-up tablet/desktop, and 1-up mobile.", status: approved}
    typography:
      - {statement: "Display reduces to 40/46 and H1 to 34/40 on mobile.", status: approved}
    spacing:
      - {statement: "Use approved 24/32/48px page gutters by viewport.", status: approved}
    visibility:
      - {statement: "Never hide evidence state, limitation, recovery action, or primary CTA solely for viewport size.", status: approved}
    media:
      - {statement: "Matrices may scroll horizontally only with row identity and status labels preserved.", status: approved}
    touch:
      - {statement: "Primary touch targets remain at least 44 by 44 CSS pixels.", status: approved}

patterns:
  landing: {applicability: required, status: approved}
  dashboard: {applicability: not_applicable, status: undefined}
  search_results: {applicability: not_applicable, status: undefined}
  detail: {applicability: required, status: approved}
  forms: {applicability: required, status: approved}
  authentication: {applicability: not_applicable, status: undefined}
  empty: {applicability: required, status: approved}
  error: {applicability: required, status: approved}
  loading: {applicability: required, status: approved}
  custom:
    scenario_index: {applicability: required, status: approved}
    scenario_evidence: {applicability: required, status: approved}
    audit_report: {applicability: required, status: approved}

visual_language:
  personality: "Calm technical authority with visible evidence hierarchy."
  density: "Moderate overall; high only inside evidence tables and code/log panels."
  contrast: "Strong text and status contrast without neon cyber-security styling."
  surface_philosophy: "Light buyer surfaces with deep-ink framing and dark evidence panels."
  border_philosophy: "Borders and tonal separation carry structure."
  shadow_philosophy: "Restrained; reserve elevation for overlays and menus."
  color_philosophy: "Light-first buyer experience, deep-ink framing, and dark evidence panels."
  typography_character: "Restrained grotesk sans with monospace reserved for evidence."
  icon_character: "Precise outline icons without security clichés."
  whitespace_philosophy: "Generous narrative rhythm with controlled density inside evidence."

guidance:
  do:
    - {id: MDS-DO-001, statement: "Use plain-language consequence beside technical evidence.", status: approved}
    - {id: MDS-DO-002, statement: "Keep evidence state and limitation visible in the same composition.", status: approved}
    - {id: MDS-DO-003, statement: "Maintain a clear route from proof to the report and engagement CTA.", status: approved}
  dont:
    - {id: MDS-DONT-001, statement: "Do not use hacker clichés, fear-first visuals, or theatrical exploit language.", status: approved}
    - {id: MDS-DONT-002, statement: "Do not rely on red and green alone to communicate evidence state.", status: approved}
    - {id: MDS-DONT-003, statement: "Do not make marketing chrome compete with proof content.", status: approved}

accessibility:
  target: "WCAG 2.2 AA"
  contrast: "AA for text, controls, and meaningful status indicators"
  focus: "Visible keyboard focus across all interactive proof controls"
  keyboard: "Complete scenario, tabs, comparison, report, and form path"
  touch_targets: "Minimum 44 by 44 CSS pixels for primary touch controls"
  motion: "No essential meaning depends on animation; reduced-motion support"
  semantic_markup: "Structured headings, landmarks, tables, lists, and form semantics"
  screen_reader: "Textual names and announcements for evidence state changes"
  image_alternatives: "Evidence remains understandable without decorative imagery"
  additional_rules: []

