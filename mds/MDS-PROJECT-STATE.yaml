  gaps:
    - {id: MDS-GAP-001, area: brand, statement: "No existing logo, brand palette, or visual reference has been supplied.", status: resolved, resolution: "Create a standalone lab identity; existing brand assets are not required."}
    - {id: MDS-GAP-002, area: foundations, statement: "Visual direction, brand relationship, color, typography, shape, and elevation await approval.", status: resolved, resolution: "Gate 2 foundation package approved in full on 2026-09-05."}
    - {id: MDS-GAP-003, area: composition, statement: "The primary experience model awaits approval before page shells and responsive behavior are defined.", status: resolved, resolution: "Approved public narrative shell flowing into a guided lab workspace, report, and engagement path."}
    - {id: MDS-GAP-004, area: components, statement: "Gate 3 component inventory, variants, and state behavior await approval.", status: resolved, resolution: "Gate 3 approved in full on 2026-09-05."}
    - {id: MDS-GAP-005, area: composition, statement: "Gate 4 layout, page-shell, responsive, navigation, and interaction rules await approval.", status: resolved, resolution: "Gate 4 approved in full on 2026-09-05."}
    - {id: MDS-GAP-S1-001, area: design_accessibility, statement: "border.default (#D6DEE7) measures 1.36:1 against surface.base. Where that border is the only boundary identifying a control, it is below the 3:1 WCAG 2.2 AA 1.4.11 non-text threshold.", observed_at: "2026-09-06", raised_by: "S1 implementation, measured contrast audit", status: resolved, resolution: "Approved by Josh Coley on 2026-09-06. Added color.border.control = #667085, measured 4.97:1 on surface.base, 4.62:1 on surface.canvas and 4.42:1 on surface.muted. Scoped to controls whose edge is the only thing identifying them as controls: the secondary button today, and form inputs in a later release. Decorative boundaries keep border.default, which 1.4.11 does not govern, so no card, table, panel, or divider changed. The value is the neutral already approved as status.untested, so the palette gained a name and no new colour."}
    - {id: MDS-GAP-S1-002, area: evidence_vocabulary, statement: "No distinct symbol was defined for the warning state ('Review required') as implemented.", observed_at: "2026-09-06", raised_by: "S1 implementation", status: resolved, resolution: "Approved by Josh Coley on 2026-09-06. Investigation found the gap statement stale and the real collision elsewhere: warning and unavailable rendered identically (same glyph, same hue, same tinted surface), separated only by label text, while vulnerable and warning were already distinct. Resolved by applying the shape assignments COMPONENTS-PROPOSAL already specifies - vulnerable alert-triangle, warning alert-circle, unavailable cloud-off - drawn in the filled-badge treatment the canonical references render. All seven evidence states now differ by silhouette or mark. No new MDS value was required; the written component spec already held the answer. See MTS-OBS-017."}
    - {id: MDS-GAP-S4-001, area: print_appearance, statement: "The approved MDS requires the report to remain readable and printable without interactive controls or dark-page backgrounds (DESIGN-SYSTEM.md section 13, COMPOSITION-PROPOSAL audit report shell, MDS-QA gate 2 REF-007), but defines no print appearance: no print token values, no treatment for the dark evidence surface on paper, and no rule for which screen controls are dropped.", observed_at: "2026-09-07", raised_by: "S4 implementation, /report print medium", status: resolved, resolved_at: "2026-09-07", resolution: "Confirmed by Josh Coley on 2026-09-07. The implemented treatment IS the approved print appearance: the print medium redefines the approved tokens (surface.ink and surface.evidence to white, text.inverse to text.strong) rather than introducing any print-only value, so the type scale, spacing, radii, and borders remain exactly as approved and every utility built on those tokens follows automatically. The three dropped controls are confirmed as the correct set: the anchor-based section index, the copy button, and unselected excerpt tabs, all of which are non-functional on paper. Nothing carrying evidence, state, limitation, recovery, or the CTA may be dropped, which the three print-medium browser checks enforce. This rule governs any future printable surface: flip the approved tokens for print, never author a print-only colour, and drop only controls that cannot function on paper. Recorded as MDS-CHG-003.", implemented_meanwhile: "The requirement is implemented without inventing a value. The print block in app/globals.css redefines the approved tokens for the print medium - surface.ink and surface.evidence resolve to white, text.inverse to text.strong - so every utility built on them follows and the type scale, spacing, radii, and borders are untouched. No print-only colour is introduced. Beyond that it only restores completeness (nothing clipped, scrolled, or collapsed), adds standard pagination, and removes the three controls that cannot function on paper: the anchor-based section index, the copy button, and unselected excerpt tabs. Nothing carrying evidence, state, limitation, recovery, or the CTA is removed.", verification: "Three browser checks run in the print medium itself rather than reading the stylesheet: no surface darker than 0.35 relative luminance survives, no element still clips or caps its height, and every finding, its reproduction evidence and its limitation still render.", requires_resolved: "The MDS decision this gap required was given on 2026-09-07: the token-flip approach and the dropped controls are confirmed as specified.", mirror_of: "MTS-PROJECT-STATE.yaml governance.gaps MDS-GAP-S4-001, which remains the record opened at implementation time. Mirrored here on owner instruction 2026-09-07 so the design system carries its own open gaps, following the MDS-GAP-S1-001/002 precedent. The two records state the same gap; this one is the design authority."}
    - {id: MDS-GAP-006, area: references, statement: "Canonical visual references must be generated, reconciled, and approved.", status: resolved, resolution: "All nine required references were reconciled and approved; Mobile Experience v4 replaced the rejected v3 composition."}
  exceptions: []
  deviations: []
  changes:
    - {id: MDS-CHG-001, at: "2026-09-06", by: Claude, approved_by: Josh Coley, area: [tokens, components], summary: "Closed MDS-GAP-S1-001 and MDS-GAP-S1-002 on owner approval. Added the color.border.control token and applied it to the secondary button; applied the COMPONENTS-PROPOSAL evidence-state shapes so vulnerable, warning, and unavailable each carry their own mark.", scope_note: "mds_version remains v1.0. No approved value was altered: border.default, every status colour, and every type, space, radius and motion token are unchanged. The palette gained one name whose value was already approved elsewhere in it. No component was added, removed, or restyled beyond the two accessibility corrections.", implementation: "mds/tokens/tokens.json, app/globals.css, components/ui/button.tsx, components/ui/state-glyph.tsx, components/ui/status-indicator.tsx, components/evidence/coverage-matrix.tsx"}
    - {id: MDS-CHG-002, at: "2026-09-07", by: Claude, requested_by: Josh Coley, area: [governance], summary: "Mirrored MDS-GAP-S4-001 into the MDS state on owner instruction. The gap was opened during S4 implementation and recorded only in mts/MTS-PROJECT-STATE.yaml and the build roadmap, because the MDS state is the design system's authority and the gap is unapproved. The owner directed that it be carried here as well, matching how MDS-GAP-S1-001 and MDS-GAP-S1-002 are held.", scope_note: "Governance bookkeeping only. mds_version remains v1.0. No token, component, composition, interaction, responsive, or accessibility decision was made, altered, or approved; the gap is recorded as open and still awaits an MDS decision. No implementation file changed.", implementation: "mds/MDS-PROJECT-STATE.yaml"}
    - {id: MDS-CHG-003, at: "2026-09-07", by: Claude, approved_by: Josh Coley, area: [foundations, composition], summary: "Closed MDS-GAP-S4-001 on owner confirmation. The print appearance of the report is now an approved MDS decision: the print medium redefines the approved tokens rather than introducing print-only values, and the anchor-based section index, the copy button, and unselected excerpt tabs are the confirmed set of controls dropped on paper.", scope_note: "mds_version remains v1.0. No approved token VALUE was altered - the decision is that the print medium re-resolves existing tokens, so the screen palette, type scale, spacing, radii, borders, and motion tokens are all untouched. No component was added, removed, or restyled. No new colour, print-only or otherwise, was introduced. The implementation this confirms was already shipped and verified under MTS-CHG-009; nothing changed in the codebase to close the gap.", rule_established: "Any future printable surface flips the approved tokens for the print medium, never authors a print-only colour, and drops only controls that cannot function on paper. Evidence, state, limitation, recovery, and the CTA are never dropped for print.", verification: "Three browser checks run in the print medium itself rather than reading the stylesheet: no surface darker than 0.35 relative luminance survives, no element still clips or caps its height, and every finding, its reproduction evidence and its limitation still render.", implementation: "app/globals.css print block; e2e/s4-report.spec.ts print-medium checks"}
